name: writingcoach
description: "月笙写作教练 - AI 驱动的小说写作辅助应用（React Native → Flutter 迁移版）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# ── 运行时依赖 ──
# 依赖映射来源：yuesheng-android 审计报告
# expo-sqlite → drift | expo-secure-store → flutter_secure_storage
# expo-document-picker → file_picker | netinfo → connectivity_plus
# expo-router → go_router | zustand → flutter_riverpod
# XHR onprogress → dio (原生 Stream 支持 SSE)
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 数据库（批次 0）
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # 状态管理（批次 3）
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由（批次 3）
  go_router: ^14.2.7

  # 平台能力（批次 2+）
  flutter_secure_storage: ^9.2.2
  # file_picker >= 10.3.3 改用 flutter.compileSdkVersion（修复 compileSdk 34 写死与
  # flutter_plugin_android_lifecycle 2.0.35 要求 36 的 AAR metadata 冲突）；10.3.10+ 修复 Tika CVE。
  # 注意：10.3.11 在镜像站被 retract，取最后一个未 retract 的 10.x（10.3.10）
  file_picker: ^10.3.10
  connectivity_plus: ^6.0.5
  dio: ^5.7.0

  # 工具
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  collection: ^1.18.0

  # 数据模型（freezed + json_serializable）
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  share_plus: ^12.0.2
  gpt_markdown: ^1.1.8

# ── 开发时依赖 ──
dev_dependencies:
  flutter_test:
    sdk: flutter
  # 模拟器/真机运行时核查（批次88 前置：编辑器姿态走查）
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 迁移测试：手工构造旧版本库（批次89 v22→v23 迁移路径）
  sqlite3: ^2.9.4

  # 代码生成
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # 启动屏生成（批次 3）
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

# ── 启动屏配置（月色竹青配色）────────────
# 运行 `dart run flutter_native_splash:create` 后生成原生资源
# 仅 Android（目标平台仅 Android，ios/web 关闭）
# P0 阶段：只做纯色背景，不引入 logo 视觉资源（后续批次再补）
flutter_native_splash:
  color: "#F7F8F6"            # 冷青灰白（暖米纸背景）
  android: true
  ios: false
  web: false
  android_gravity: center
  android_12:
    color: "#F7F8F6"          # 冷青灰白（Android 12+ 启动屏背景）
    icon_background_color: "#2D5A52"   # 深墨竹青（图标底色，月色竹青主色）

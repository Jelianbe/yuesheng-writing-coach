# 关机硬约束：单 Gradle JVM 内存上限压到 2g（原 -Xmx8G + Metaspace 4G 在 15.7G 机器上会触发关机）
# ReservedCodeCache 也压到 256m；HeapDumpOnOutOfMemoryError 保留用于 OOM 诊断
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 插件模块统一 compileSdk（官方机制，所有插件模块继承此值；
# file_picker >= 10.3.3 也读取它，替代旧版写死 34 的 build.gradle）
flutter.compileSdkVersion=36
# Flutter 3.x + AGP 9.0 默认 newDsl=true / builtInKotlin=true，但会导致旧 DSL 的
# build.gradle.kts（signingConfigs/create）classcast 失败。回退到旧 DSL。
# AGP 10 会移除这些 flag，届时迁移到新 DSL ApplicationExtension API。
android.newDsl=false
android.builtInKotlin=false
# ── Kotlin 增量缓存损坏硬约束 ─────────────────────────────
# 现象：shared_preferences_android / connectivity_plus 的 compileReleaseKotlin
#       抛 "Could not close incremental caches ... class-fq-name-to-source.tab"
# 根因：AGP 9.0.1 + Kotlin 2.3.20 在 Windows 下的 PersistentMap/SLRUMap 写缓存时
#       偶发性异常（Gradle 9.1 升级后加剧）。
# 代价：全量编译速度下降约 15%，但构建稳定性显著提升；
#       比每次 build 都清 build 目录快得多。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# ── 项目内存硬约束（对齐 yuesheng-android）────────────
# 禁用 JDK 自动下载（网络不可达，用本地 D:/jdk-17）
org.gradle.java.installations.auto-download=false
org.gradle.java.home=D:/jdk-17
# Gradle User Home 由环境变量 GRADLE_USER_HOME 注入（原写死 D:/Gradle/.gradle
# 是无写权限目录，导致缓存分裂、transforms 状态不一致）

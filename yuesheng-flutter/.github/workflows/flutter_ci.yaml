name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      # 依赖安装
      - run: flutter pub get

      # 门禁 1: dart analyze
      - name: dart analyze
        run: dart analyze --fatal-warnings

      # TODO: 测试修复后取消注释
      # # 门禁 2: flutter test
      # - name: flutter test
      #   run: flutter test --exclude-tags live,external

      # 门禁 7: Prompt 反模式检查（纯 Python 脚本）
      - name: check prompt antipattern
        run: python scripts/check_prompt_antipattern.py --diff-baseline

      # 门禁 8: 内容元数据检查（纯 Python 脚本）
      - name: check content metadata
        run: python scripts/check_content_metadata.py --strict

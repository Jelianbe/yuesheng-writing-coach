name: Flutter CI (yuesheng-flutter)

# 教训落地：报告第四节 #4「测试覆盖用机器保证」——把 analyze + test 设进 CI 门禁，
# 不允许「没测试也提交 / 靠人工跑」。仅当 Flutter 子目录或本工作流变更时触发，
# 避免 RN 工程改动无谓消耗 CI。
on:
  push:
    paths:
      - 'yuesheng-flutter/**'
      - '.github/workflows/flutter_ci.yaml'
  pull_request:
    paths:
      - 'yuesheng-flutter/**'
      - '.github/workflows/flutter_ci.yaml'

permissions:
  contents: read

jobs:
  flutter-verify:
    name: dart analyze + flutter test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yuesheng-flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与本地开发 SDK 对齐（本机 Flutter 3.44.8 / Dart 3.12.2）。
          # 若该精确版本在 stable 镜像不可拉取，删掉 flutter-version 一行、仅留 channel: 'stable' 即可。
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Skip Flutter update check (avoid network hang)
        run: echo "FLUTTER_SKIP_UPDATE_CHECK=true" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze lib

      - name: Run tests
        # 含 LLM 的 live 测试组在无 DEEPSEEK_API_KEY 时会 markTestSkipped（见 flutter-llm-coach-validation skill），
        # 无需密钥。此处额外 --exclude-tags 做双保险（B2-5 方案）：即使某条 live 测试 markTestSkipped 位置没提前到
        # LlmClient() 构造之前，也不会触发出站 LLM/External 网络调用，直接跳过整个标签组，从根源避免 CI 因外网静默 hang。
        run: flutter test --exclude-tags live,external --coverage
      - name: Verify coverage artifact
        # 仅做存在性+大小校验；防止 --coverage 没生效（test 全 PASS 但 coverage 生成失败时能立即暴露），
        # 不做行覆盖率阈值断言（阈值策略单独立项）。
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "❌ coverage/lcov.info not generated"
            exit 1
          fi
          echo "✅ coverage/lcov.info exists"
          wc -l coverage/lcov.info
          ls -lh coverage/lcov.info

      - name: Upload coverage artifact
        # 上传到 GitHub Actions Artifacts（免费 90 天保存），便于手动下载 lcov.info 本地查看 / 后续接入 codecov.io。
        # 注意 artifacts 不提供行覆盖率百分比数值面板；如需可视化覆盖率报告，后续补 genhtml / Coveralls / codecov 独立 step。
        uses: actions/upload-artifact@v4
        with:
          name: yuesheng-flutter-coverage-${{ github.sha }}
          path: yuesheng-flutter/coverage/lcov.info
          if-no-files-found: error
          retention-days: 90

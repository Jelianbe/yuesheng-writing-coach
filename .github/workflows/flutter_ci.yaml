name: Flutter CI (yuesheng-flutter)

# ---------------------------------------------------------------------------
# ★ 本地十二道 vs 本 CI 实际覆盖（2026-09-17 口径收口 —— 事实登记，非待办）
#
# 本地权威口径 = yuesheng-flutter/scripts/gate.sh（十二道，编号 0–11）。
# 本 workflow 只跑其中一部分。这是**已知且被接受**的设计，不是遗漏：
# R-027 的 machine_check 明确写着「门禁 5 目前只在本地 gate.sh 执行，CI 未接入」。
#
#   CI 覆盖：0 format · 1 analyze · 2 test · 3 circular · 4 secrets · 6 coverage
#   CI 未跑：5 R-019 函数行数 · 7 Prompt 反模式 · 8 内容元数据 ·
#           9 交互回归 · 10 伪拆分形态 · 11 A 类豁免准入
#           （六道均为**纯静态 python 脚本**，不依赖 Flutter SDK，具备接入条件；
#             未接入的理由是控制 CI 时长与失败面，而非不可行。）
#   仅 CI 有：依赖健康（dart pub outdated）—— 本地十二道里**没有**这一道。
#
# ⇒ 判据：**本地全绿才是收尾**；CI 全绿 ≠ 十二道全绿。
# ⇒ 编号纪律：本地编号 0–11 见 gate.sh 头部注释（唯一真源）。写 CI step 名时
#    不得把「本地没有的门禁」也标成某个本地编号（历史上 "Gate 5" 撞号过一次）。
# ---------------------------------------------------------------------------

# 教训落地：报告第四节 #4「测试覆盖用机器保证」——把 analyze + test 设进 CI 门禁，
# 不允许「没测试也提交 / 靠人工跑」。仅当 Flutter 子目录或本工作流变更时触发，
# 避免 RN 工程改动无谓消耗 CI。
on:
  push:
    paths:
      - 'yuesheng-flutter/**'
      - '.github/workflows/flutter_ci.yaml'
  pull_request:
    paths:
      - 'yuesheng-flutter/**'
      - '.github/workflows/flutter_ci.yaml'

permissions:
  contents: read
  issues: write  # X-029-T1WARN: Track step 需要 gh CLI 更新 coverage-tracker issue

jobs:
  flutter-verify:
    name: dart analyze + flutter test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yuesheng-flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与本地开发 SDK 对齐（本机 Flutter 3.44.8 / Dart 3.12.2）。
          # 若该精确版本在 stable 镜像不可拉取，删掉 flutter-version 一行、仅留 channel: 'stable' 即可。
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Skip Flutter update check (avoid network hang)
        run: echo "FLUTTER_SKIP_UPDATE_CHECK=true" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting (Gate 0)
        # 宪法 §二.2：dart format --set-exit-if-changed 通过。
        # X-034-FORMAT 基线 commit 3c95534c 之后，任何格式漂移都会被阻断。
        # 2026-09-17 范围收口：原为 `lib`，现与本地 gate.sh 门禁 0 对齐为
        #   `lib test integration_test tool` —— 此前 test/ 从未被格式检查
        #   （本地扩范围后实测 rc=0，test/ 的格式债已于同期批次清零）。
        run: dart format --set-exit-if-changed -o none lib test integration_test tool

      - name: Static analysis (Gate 1)
        # ⚠️ 必须用 `dart analyze`，**不要**改成 `flutter analyze`：
        #    前者默认 --fatal-infos=off，后者 infos 也 fatal ⇒ 会得到 rc=1 的假红
        #    （本地 gate.sh 头部注释已记载该坑）。
        # 2026-09-17 范围收口：原为 `flutter analyze lib`，现与本地 gate.sh 门禁 1
        #    对齐为 lib + integration_test + tool + test。扩范围的动因是实证代价：
        #    integration_test/ 与 test/ 里各躺着一个**编译级 error**长达一个月无人察觉。
        run: dart analyze lib integration_test tool test

      - name: Check circular dependencies (Gate 3)
        # 宪法 §二.4 + R-020 循环依赖零容忍：lib 内 import 图 DFS，0 环必过。
        # 与本地 gate.sh / pre-commit 调用同一脚本 scripts/check_circular.py，行为一致。
        run: python3 scripts/check_circular.py

      - name: Check hardcoded secrets (Gate 4)
        # 宪法 §六 密钥零硬编码 + R-029：扫描 lib/*.dart 的疑似密钥，llm_config_storage.dart 白名单豁免。
        # 与本地 gate.sh / pre-commit 调用同一脚本 scripts/check_secrets.sh，行为一致。
        run: bash scripts/check_secrets.sh

      - name: Check dependency health (advisory, non-blocking for push/main)
        # ⚠️ 本条**不是**本地十二道里的「门禁 5」——本地门禁 5 = R-019 函数行数
        #    （tool/check_r019.py）。历史上这里写作 "Gate 5"，与本地编号体系撞号：
        #    两个「5」指两件完全不同的事。2026-09-17 收口时去掉该编号，避免歧义。
        #    依赖健康在本地十二道里**没有**对应门禁，是 CI 独有的一道。
        # 宪法 §二.6 依赖审计：dart pub outdated --json 解析（CLI 更名）。
        # 分级：CRITICAL（命中官方安全公告 isCurrentAffectedByAdvisory）/ HIGH（停更/撤回）/ MEDIUM / LOW。
        # push/main 模式 = 仅告警不阻断（exit 0），CRITICAL/HIGH 通过 ::warning 注解在 Actions UI 标红。
        # release build 前人工审查 = 同一脚本加 --mode release，CRITICAL 直接 exit 1 阻断。
        # 高危豁免：scripts/dependency_exemptions.json（until_date + D# 决策号登记，过期自动失效）。
        run: dart pub outdated --json --no-dependency-overrides | python3 scripts/check_outdated.py --mode push

      - name: Run tests (Gate 2)
        # 含 LLM 的 live 测试组在无 DEEPSEEK_API_KEY 时会 markTestSkipped（见 flutter-llm-coach-validation skill），
        # 无需密钥。此处额外 --exclude-tags 做双保险（B2-5 方案）：即使某条 live 测试 markTestSkipped 位置没提前到
        # LlmClient() 构造之前，也不会触发出站 LLM/External 网络调用，直接跳过整个标签组，从根源避免 CI 因外网静默 hang。
        # 2026-09-17 口径收口：该 --exclude-tags 本地也已补上（原先**只有 CI 有**，本地
        #   gate.sh 门禁 2 不排除 live/external ⇒ 同一仓库两套口径）。本地由
        #   scripts/_run_flutter_test.sh 固定附加，且本地会另加 --coverage（CI 在此也加了）。
        run: flutter test --exclude-tags live,external --coverage
      - name: Verify coverage artifact
        # 仅做存在性+大小校验；防止 --coverage 没生效（test 全 PASS 但 coverage 生成失败时能立即暴露）。
        # 行覆盖率阈值断言放在下一个独立 step "Enforce coverage thresholds"，职责分离。
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "❌ coverage/lcov.info not generated"
            exit 1
          fi
          echo "✅ coverage/lcov.info exists"
          wc -l coverage/lcov.info
          ls -lh coverage/lcov.info

      - name: Enforce coverage thresholds (T1 overall soft + T2 core hard)
        # X-026-COV 阈值策略落地（X-027/X-028 已补完 T2 缺口，X-029-T1WARN 加 WARN 计数）：
        #   T1 整体行覆盖率（软门槛）：target ≥65%，±2% 容差 → <63% 才 FAIL，[63,65) WARN 不阻断（容忍小幅抖动）。
        #   T2 核心文件（硬门槛）：5 文件全部 85%，任一跌破直接 FAIL CI（实测：training_evaluator 96.03% / evaluation_service 89.47% / diagnosis_repository 92.50% / chat_service 90.07% / focus_resolver 95.87%）。
        # X-029-T1WARN: --warn-event-file 生成结构化 JSON 事件供下一步 Track 解析，
        #   跨 run WARN 累计计数由 Track step（gh CLI + Issue tracker）维护，Python 脚本保持单一职责。
        run: |
          python3 scripts/check_coverage.py \
            --lcov coverage/lcov.info \
            --t1-target 65.0 --t1-margin 2.0 \
            --t2 "lib/services/training_evaluator.dart:85" \
            --t2 "lib/services/evaluation_service.dart:85" \
            --t2 "lib/data/repositories/diagnosis_repository.dart:85" \
            --t2 "lib/services/chat_service.dart:85" \
            --t2 "lib/services/focus_resolver.dart:85" \
            --warn-event-file coverage/warn-event.json

      - name: Track T1 WARN (cross-run counter via Issue)
        # X-029-T1WARN: T1 软门槛 WARN 不阻断 CI，但连续 3 次 WARN 需人工审查。
        # 用 GitHub Issue 作为跨 run 状态载体（不污染 git 历史）。
        # 仅在 Enforce step 通过（exit 0 = T1 PASS 或 WARN + T2 全 PASS）时执行；FAIL 由 Enforce step 阻断，不进累计。
        # Issue 标签: coverage-tracker。Issue body 第一行维护计数：`count: N`。
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WARN_THRESHOLD: "3"
        run: |
          set -euo pipefail
          if [ ! -f coverage/warn-event.json ]; then
            echo "warn-event.json not found, skip tracking"
            exit 0
          fi

          EVENT=$(python3 -c "import json; print(json.load(open('coverage/warn-event.json'))['event'])")
          RATE=$(python3 -c "import json; print(json.load(open('coverage/warn-event.json'))['t1_rate'])")
          echo "T1 event: $EVENT (rate=$RATE%)"

          # 查找 open 的 coverage-tracker issue
          ISSUE_NUMBER=$(gh issue list --label "coverage-tracker" --state open --json number --jq '.[0].number // empty' || echo "")

          if [ "$EVENT" = "warn" ]; then
            if [ -z "$ISSUE_NUMBER" ]; then
              # 首次 WARN：创建 issue
              ISSUE_NUMBER=$(gh issue create \
                --label "coverage-tracker" \
                --title "Coverage WARN tracker (auto)" \
                --body "count: 1
          last_rate: $RATE
          last_time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --json number --jq '.number')
              echo "Created coverage-tracker issue #$ISSUE_NUMBER (count: 1/$WARN_THRESHOLD)"
            else
              # 后续 WARN：解析 body 计数 +1
              BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body')
              COUNT=$(echo "$BODY" | grep -oP '^count: \K\d+' || echo "0")
              NEW_COUNT=$((COUNT + 1))
              gh issue edit "$ISSUE_NUMBER" --body "count: $NEW_COUNT
          last_rate: $RATE
          last_time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Updated coverage-tracker issue #$ISSUE_NUMBER (count: $NEW_COUNT/$WARN_THRESHOLD)"
              if [ "$NEW_COUNT" -ge "$WARN_THRESHOLD" ]; then
                echo "::warning::T1 WARN count reached $NEW_COUNT (threshold $WARN_THRESHOLD), please investigate coverage drift"
                gh issue comment "$ISSUE_NUMBER" --body "⚠️ T1 coverage WARN reached $NEW_COUNT/$WARN_THRESHOLD consecutive runs (latest rate: $RATE%). Please investigate coverage drift and consider tightening tolerance to ±1% or adding targeted tests."
              fi
            fi
          elif [ "$EVENT" = "pass" ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              # PASS：重置计数 + 关闭 issue
              gh issue comment "$ISSUE_NUMBER" --body "✅ T1 coverage PASS (rate: $RATE%), counter reset."
              gh issue close "$ISSUE_NUMBER"
              echo "Closed coverage-tracker issue #$ISSUE_NUMBER (counter reset)"
            else
              echo "T1 PASS, no open tracker issue to close"
            fi
          fi

      - name: Upload coverage artifact
        # 上传到 GitHub Actions Artifacts（免费 90 天保存），便于手动下载 lcov.info 本地查看 / 后续接入 codecov.io。
        # 注意 artifacts 不提供行覆盖率百分比数值面板；如需可视化覆盖率报告，后续补 genhtml / Coveralls / codecov 独立 step。
        uses: actions/upload-artifact@v4
        with:
          name: yuesheng-flutter-coverage-${{ github.sha }}
          path: yuesheng-flutter/coverage/lcov.info
          if-no-files-found: error
          retention-days: 90

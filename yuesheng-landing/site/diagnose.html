<style>
  :root {
    /* 统一设计令牌（与 index.html 同源：bamboo 系，2026-11-12 设计师决策单 D1） */
    --bamboo: #2D5A52;
    --bamboo-deep: #244A43;
    --bamboo-soft: #E7EFEC;
    --bg: #F7F8F6;        /* 页面底（语义唯一：页面背景） */
    --paper: #FCFCF9;     /* 容器面（语义唯一：卡片/气泡/header 底） */
    --ink: #22302C;
    --ink-2: #5C6B66;
    --line: #DCE4E0;
    --shadow: 0 1px 2px rgba(34,48,44,.05), 0 8px 24px rgba(34,48,44,.06);
    --radius: 14px;
    /* 状态色（独立于品牌轴） */
    --status-danger: #8A3C34;
    --status-warn-bg: #FBF6EC;
    /* 旧名别名（保现有选择器不动，逐步退役） */
    --brand: var(--bamboo);
    --brand-deep: var(--bamboo-deep);
    --brand-soft: var(--bamboo-soft);
    --ink-soft: var(--ink-2);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
  }
  /* ── 左侧对话列表 ── */
  #sidebar {
    width: 232px; flex: none; background: var(--paper);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 12px 10px; gap: 10px;
  }
  #sidebar .brand {
    display: flex; align-items: center; gap: 8px;
    padding: 0 4px 6px; border-bottom: 1px solid var(--line);
  }
  #sidebar .brand .logo {
    width: 28px; height: 28px; border-radius: 50%; flex: none;
    background: var(--brand); color: #fff; display: flex; align-items: center;
    justify-content: center; font-size: 14px;
  }
  #sidebar .brand b { font-size: 14.5px; letter-spacing: 1px; }
  #sidebar .brand a { color: inherit; text-decoration: none; }
  #newConvo {
    font: inherit; font-size: 14px; cursor: pointer;
    background: var(--brand); color: #fff; border: 0; border-radius: 10px;
    padding: 9px 12px; letter-spacing: 1px; text-align: center;
  }
  #convoList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .convo-item {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: 10px; cursor: pointer;
    font-size: 13.5px; line-height: 1.5; border: 1px solid transparent;
  }
  .convo-item:hover { background: var(--brand-soft); }
  .convo-item.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-deep); }
  .convo-item .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo-item .del {
    flex: none; width: 20px; height: 20px; border-radius: 6px; border: 0;
    background: transparent; color: var(--ink-soft); cursor: pointer;
    font-size: 13px; line-height: 1; display: none; font-family: sans-serif;
  }
  .convo-item:hover .del { display: block; }
  .convo-item .del:hover { background: #f3e3e0; color: var(--danger); }
  .list-empty { font-size: 12.5px; color: var(--ink-soft); padding: 8px 10px; }
  /* ── 右侧主区 ── */
  #rightCol { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
  header {
    background: var(--paper); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 5;
  }
  #menuBtn {
    display: none; font: inherit; font-size: 17px; line-height: 1;
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; color: var(--ink); flex: none;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: 1px; font-family: "Noto Serif SC", serif; }
  header h1 a { color: inherit; text-decoration: none; }
  .hd-logo { width: 32px; height: 32px; border-radius: 8px; flex: none; }
  .hd-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .nav-home {
    color: var(--bamboo); font-size: 14px; text-decoration: none;
    padding: 10px 12px; display: inline-flex; align-items: center;
  }
  .nav-home:hover { color: var(--bamboo-deep); }
  .nav-dl-ghost {
    color: var(--bamboo); font-size: 13.5px; text-decoration: none;
    border: 1px solid var(--bamboo); border-radius: 999px;
    padding: 7px 16px; display: inline-flex; align-items: center;
    transition: background .18s, color .18s;
  }
  .nav-dl-ghost:hover { background: var(--bamboo); color: #F7F8F6; }
  /* 侧栏下载入口：桌面隐藏（导航在 header），移动端入抽屉 */
  .side-dl {
    display: none; font: inherit; font-size: 14px; cursor: pointer;
    text-decoration: none; text-align: center; letter-spacing: 1px;
    background: var(--bamboo); color: #fff; border-radius: 10px; padding: 12px;
  }
  main { flex: 1; overflow-y: auto; padding: 18px 14px 8px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin: 0 0 14px; display: flex; gap: 10px; }
  .msg .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: var(--brand); color: #fff; font-size: 15px;
    display: flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--ink-soft); }
  .bubble {
    max-width: calc(100% - 56px); background: var(--paper);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 16px; line-height: 1.75; font-size: 15px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--bamboo-deep); color: #f2f6f4; border-color: var(--bamboo-deep); }
  .bubble.think { color: var(--ink-soft); font-size: 13.5px; border-style: dashed; }
  .bubble.err { background: var(--warn-bg); border-color: #e5d6b2; color: #7a5c22; }
  /* Markdown 渲染气泡 */
  .bubble.md { white-space: normal; }
  .bubble.md p { margin: 0 0 .6em; } .bubble.md p:last-child { margin-bottom: 0; }
  .bubble.md h1, .bubble.md h2, .bubble.md h3, .bubble.md h4 { font-size: 1em; margin: .8em 0 .4em; font-weight: 700; }
  .bubble.md ul, .bubble.md ol { margin: .4em 0 .6em; padding-left: 1.4em; }
  .bubble.md li { margin: .15em 0; }
  .bubble.md code { background: #eef3ef; border-radius: 4px; padding: 1px 5px; font-size: .9em; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .bubble.md pre { background: #eef3ef; border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: .6em 0; }
  .bubble.md pre code { background: none; padding: 0; }
  .bubble.md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--ink-soft); margin: .6em 0; }
  .bubble.md strong { font-weight: 700; }
  .bubble.md table { border-collapse: collapse; margin: .6em 0; font-size: .92em; display: block; overflow-x: auto; }
  .bubble.md th, .bubble.md td { border: 1px solid var(--line); padding: 4px 8px; }
  .retry-btn {
    margin-top: 8px; font: inherit; font-size: 13px; cursor: pointer;
    background: transparent; border: 1px solid #b58a3a; color: #7a5c22;
    border-radius: 8px; padding: 5px 14px;
  }
  .retry-btn:hover { background: #f3e8d2; }
  /* 诊断卡内逐条练习 / 确认指认 / 排除按钮（动作词汇贴 App 诊断卡） */
  .syn-practice, .syn-ack, .syn-exclude {
    font: inherit; font-size: 12.5px; cursor: pointer; margin-top: 6px;
    background: var(--bamboo-soft); color: var(--bamboo-deep);
    border: 1px solid var(--bamboo); border-radius: 999px;
    min-height: 36px; padding: 4px 14px;
  }
  .syn-practice:hover, .syn-ack:hover, .syn-exclude:hover { background: var(--brand); color: #fff; }
  .syn-ack:disabled, .syn-exclude:disabled { opacity: .55; cursor: default; }
  /* 诊断卡 */
  .dcard {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px; margin: 0 0 14px; margin-left: 44px; font-size: 14.5px;
  }
  .dcard h3 { margin: 0 0 8px; font-size: 14px; color: var(--brand-deep); letter-spacing: 1px; }
  .sev { font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-right: 6px; }
  .sev.L1 { background: #eef4ee; color: #3c6e50; }
  .sev.L2 { background: #fdf3e2; color: #9a6b1a; }
  .sev.L3 { background: #f9e9e6; color: var(--danger); }
  .synd { border-top: 1px dashed var(--line); padding: 10px 0; }
  .synd:first-of-type { border-top: 0; padding-top: 4px; }
  .synd b { font-size: 15px; }
  .synd .evid { color: var(--ink-soft); font-size: 13px; margin: 4px 0 2px; }
  .synd .evid em { background: #f0f5f1; padding: 0 4px; border-radius: 4px; font-style: normal; }
  .synd .imp { color: var(--brand-deep); font-size: 13px; margin-top: 3px; }
  .overall { background: var(--brand-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 13.5px; }
  .dactions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .dactions button {
    font: inherit; font-size: 13.5px; cursor: pointer;
    background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 7px 14px;
  }
  .dactions button.ghost { background: transparent; color: var(--brand-deep); border: 1px solid var(--brand); }
  footer {
    border-top: 1px solid var(--line); background: var(--paper);
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; font: inherit; font-size: 16px; line-height: 1.6;
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
    background: var(--paper); color: var(--ink); resize: none; min-height: 46px; max-height: 180px;
    outline: none;
  }
  textarea:focus { border-color: var(--brand); }
  #send {
    font: inherit; font-size: 15px; cursor: pointer; flex: none;
    background: var(--brand); color: #fff; border: 0; border-radius: 12px;
    padding: 11px 20px; letter-spacing: 2px;
  }
  #send:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--ink-soft); }
  .typing { display: inline-block; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  /* 移动端：侧栏抽屉 */
  #scrim { display: none; }
  @media (max-width: 760px) {
    #menuBtn { display: block; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 20;
      transform: translateX(-100%); transition: transform .22s ease;
      box-shadow: 0 0 24px rgba(0,0,0,.12);
    }
    body.sidebar-open #sidebar { transform: translateX(0); }
    #scrim {
      display: block; position: fixed; inset: 0; z-index: 19;
      background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .22s;
    }
    body.sidebar-open #scrim { opacity: 1; pointer-events: auto; }
    .dcard { margin-left: 0; }
    header h1 { font-size: 15px; }
    .nav-dl-ghost { display: none; }
    .side-dl { display: block; }
    .syn-practice { min-height: 44px; }
    .syn-practice + .syn-practice { margin-top: 8px; }
  }
</style>

<script>
(function () {
  'use strict';
  var chatEl = document.getElementById('chat');
  var inputEl = document.getElementById('input');
  var sendEl = document.getElementById('send');
  var listEl = document.getElementById('convoList');
  var sending = false;
  var SELFTEST = location.search.indexOf('selftest') !== -1;
  function selfreport(data) {
    if (!SELFTEST) return;
    try { fetch('/engine_result?d=' + encodeURIComponent(JSON.stringify(data))); } catch (_) {}
  }

  // ── 多会话存储（全部本地 localStorage）──────────────────
  var CONVOS_KEY = 'yuesheng_web_convos_v1';        // 索引：[{id,title,createdAt,updatedAt}]
  var ACTIVE_KEY = 'yuesheng_web_convo_active_v1';  // 当前会话 id
  var LEGACY_KEY = 'yuesheng_web_trial_state_v1';   // 旧版单会话（迁移用）
  function convoKey(id) { return 'yuesheng_web_convo_' + id; }
  function listConvos() {
    try { var l = JSON.parse(localStorage.getItem(CONVOS_KEY)); return Array.isArray(l) ? l : []; }
    catch (_) { return []; }
  }
  function saveConvos(l) { try { localStorage.setItem(CONVOS_KEY, JSON.stringify(l)); } catch (_) {} }
  function getActiveId() { return localStorage.getItem(ACTIVE_KEY) || null; }
  function setActiveId(id) { try { localStorage.setItem(ACTIVE_KEY, id); } catch (_) {} }
  function loadConvoState(id) {
    try {
      var raw = localStorage.getItem(convoKey(id));
      if (raw) { var s = JSON.parse(raw); if (s && s.phase) return s; }
    } catch (_) {}
    return initialState();
  }
  function saveConvoState(id, st) {
    try { localStorage.setItem(convoKey(id), JSON.stringify(st)); } catch (_) {}
  }
  function dropConvoState(id) { try { localStorage.removeItem(convoKey(id)); } catch (_) {} }

  // ── 当前会话 ─────────────────────────────────────────────
  var state = null;       // 当前会话状态
  var curId = null;       // 当前会话 id

  function findEmptyConvo() {
    // 已有空白对话（标题未定名且无历史）⇒ 复用，不重复创建
    var l = listConvos();
    for (var i = 0; i < l.length; i++) {
      if (l[i].title === '新对话') {
        var st = loadConvoState(l[i].id);
        if (!st.history.length) return l[i].id;
      }
    }
    return null;
  }

  function newConversation(silent) {
    // 防重复：已存在空白对话 ⇒ 切过去，不再新建
    var empty = findEmptyConvo();
    if (empty) {
      if (empty === curId) { closeSidebar(); return; }
      switchConvo(empty);
      return;
    }
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    var l = listConvos();
    l.unshift({ id: id, title: '新对话', createdAt: Date.now(), updatedAt: Date.now() });
    saveConvos(l);
    dropConvoState(id);
    state = initialState();
    curId = id;
    setActiveId(id);
    renderList();
    chatEl.innerHTML = '';
    if (!silent) greet();
  }

  function touchConvo() {
    var l = listConvos();
    for (var i = 0; i < l.length; i++) {
      if (l[i].id === curId) {
        l[i].updatedAt = Date.now();
        // 标题：首条用户消息前 20 字
        if ((l[i].title === '新对话')) {
          for (var j = 0; j < state.history.length; j++) {
            if (state.history[j].role === 'user' && state.history[j].content &&
                state.history[j].content.indexOf('__') !== 0) {
              l[i].title = state.history[j].content.replace(/\s+/g, ' ').slice(0, 20);
              break;
            }
          }
        }
        break;
      }
    }
    saveConvos(l);
    renderList();
  }

  function switchConvo(id) {
    if (id === curId) { closeSidebar(); return; }
    saveConvoState(curId, state);
    curId = id;
    setActiveId(id);
    state = loadConvoState(id);
    chatEl.innerHTML = '';
    renderHistory();
    closeSidebar();
  }

  function deleteConvo(id) {
    var l = listConvos().filter(function (c) { return c.id !== id; });
    saveConvos(l);
    dropConvoState(id);
    if (id === curId) {
      if (l.length) { switchConvo(l[0].id); }
      else { newConversation(false); }
    } else {
      renderList();
    }
  }

  function renderList() {
    var l = listConvos();
    if (!l.length) {
      listEl.innerHTML = '<div class="list-empty">还没有对话，点上方「＋ 新对话」开始。</div>';
      return;
    }
    var html = '';
    l.forEach(function (c) {
      html += '<div class="convo-item' + (c.id === curId ? ' on' : '') + '" data-id="' + esc(c.id) + '" title="' + esc(c.title) + '">' +
        '<span class="title">' + esc(c.title) + '</span>' +
        '<button class="del" data-del="' + esc(c.id) + '" title="删除此对话">×</button>' +
        '</div>';
    });
    listEl.innerHTML = html;
    Array.prototype.forEach.call(listEl.querySelectorAll('.convo-item'), function (el) {
      el.addEventListener('click', function (e) {
        if (e.target && e.target.getAttribute('data-del')) return;
        switchConvo(el.getAttribute('data-id'));
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll('.del'), function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        deleteConvo(el.getAttribute('data-del'));
      });
    });
  }

  // ── 渲染 ────────────────────────────────────────────────
  function addBubble(role, text, cls) {
    // 最终防线：assistant 私有标记（__CARD__ / __CARD_PRACTICE__）永不作为气泡显示
    if (role === 'assistant' && typeof text === 'string' && text.indexOf('__') === 0) return null;
    var div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
    var avatar = role === 'user' ? '你' : '月';
    div.innerHTML = '<div class="avatar">' + avatar + '</div>' +
      '<div class="bubble ' + (cls || '') + '"></div>';
    div.querySelector('.bubble').textContent = text;
    chatEl.appendChild(div);
    scrollBottom();
    return div.querySelector('.bubble');
  }

  // Markdown 安全渲染（marked 解析 + DOMPurify 消毒；异常时退回纯文本 esc）
  function renderMd(text) {
    try {
      var html = window.marked ? window.marked.parse(text || '') : esc(text || '');
      return window.DOMPurify ? window.DOMPurify.sanitize(html) : esc(text || '');
    } catch (_) { return esc(text || ''); }
  }

  // assistant 正文走 Markdown 气泡（模型输出是 md；消毒防注入）
  function addMdBubble(role, text) {
    var div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = '<div class="avatar">月</div><div class="bubble md"></div>';
    div.querySelector('.bubble').innerHTML = renderMd(text);
    chatEl.appendChild(div);
    scrollBottom();
    return div.querySelector('.bubble');
  }

  function renderHistory() {
    var shown = false;
    (state.history || []).forEach(function (m) {
      if (!m.content) return;
      if (m.content.indexOf('__CARD_PRACTICE__') === 0) return; // 旧版练习标记，不渲染
      if (m.content.indexOf('__CARD__') === 0) {                // 诊断卡持久化标记 → 重绘
        try { renderDiagnosisCard(JSON.parse(m.content.slice(8))); } catch (_) {}
        shown = true;
        return;
      }
      if (m.role === 'assistant') { addMdBubble(m.role, m.content); }
      else { addBubble(m.role, m.content); }
      shown = true;
    });
    if (!shown) greet();
  }

  function scrollBottom() {
    var m = document.querySelector('main');
    m.scrollTop = m.scrollHeight;
  }

  // ── 匿名统计埋点（事件词汇贴 App edit_diff_events / 诊断卡动作）────────
  // 只传结构化标识，不传稿件文本；失败不阻断（对齐 App anchor_ack 埋点先例）。
  // selftest 跑假流式也会渲染诊断卡 ⇒ 自测下关闭埋点，避免污染统计。
  function sendEvent(eventType, payload) {
    if (SELFTEST) return;
    try {
      if (!(window.WbcsBridge && window.WbcsBridge.insertEvent)) return;
      var row = {
        event_type: eventType,
        payload: payload || {},
        source: 'web',
        session_tag: curId || '',
        client_created_at: new Date().toISOString()
      };
      window.WbcsBridge.insertEvent(JSON.stringify({
        endpoint: WB_CONFIG.endpoint,
        publishableKey: WB_CONFIG.publishableKey,
        table: 'interaction_events',
        row: row
      }));
    } catch (_e) { /* 埋点失败不阻断 */ }
  }

  // 确认指认 / 排除（对齐 App 诊断卡动作；会话级内存态，不跨轮次；二选一后对侧禁用）
  function ackSyndrome(btn) {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '✓ 已确认指认';
    var other = btn.parentElement.querySelector('.syn-exclude');
    if (other) other.disabled = true;
    sendEvent('anchor_ack', { syndrome_id: btn.getAttribute('data-syn') });
  }
  function excludeSyndrome(btn) {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '已排除';
    var other = btn.parentElement.querySelector('.syn-ack');
    if (other) other.disabled = true;
    sendEvent('exclusion', { syndrome_id: btn.getAttribute('data-syn') });
  }

  // 诊断卡渲染（ParsedDiagnosis 结构 → 卡片；每条症候可单独练）
  function renderDiagnosisCard(d) {
    // 空卡壳抑制（§4-509 残留待裁 · 舰长 2026-11-12 22:0x 批）：100 字基线边界下
    // 模型会输出 syndromes 空的协议块 ⇒ 旧逻辑渲染只剩「换个片段再诊断」按钮的
    // 纯空壳。判据 = 无症候 ∧ 无排除 ∧ 无整体判定 ⇒ 不渲染；
    // 带 overall.verdict 的诚实卡（如「无文本，未进入诊断」）有信息量，保留。
    var hasSyndromes = (d.syndromes || []).length > 0;
    var hasExcluded = (d.excluded || []).length > 0;
    var hasOverall = !!(d.overall && d.overall.verdict);
    if (!hasSyndromes && !hasExcluded && !hasOverall) return;
    var div = document.createElement('div');
    div.className = 'dcard';
    var html = '<h3>结构化诊断</h3>';
    if (d.overall && d.overall.verdict) {
      html += '<div class="overall"><b>整体判定：' + esc(d.overall.verdict) + '</b>';
      if (d.overall.coverage) html += ' · ' + esc(d.overall.coverage);
      if (d.overall.keep) html += '<br>值得保持：' + esc(d.overall.keep);
      html += '</div>';
    }
    (d.syndromes || []).forEach(function (s) {
      html += '<div class="synd"><span class="sev ' + esc(s.severity || 'L2') + '">' + esc(s.severity || 'L2') + '</span>' +
        '<b>' + esc(s.name || '未命名问题') + '</b>';
      (s.evidence || []).slice(0, 3).forEach(function (ev) {
        html += '<div class="evid">原文：<em>' + esc(ev) + '</em></div>';
      });
      if (s.explanation) html += '<div>' + esc(s.explanation) + '</div>';
      if (s.reader_impact) html += '<div class="imp">读者影响：' + esc(s.reader_impact) + '</div>';
      if (s.syndrome_id) {
        html += '<button class="syn-practice" data-syn="' + esc(s.syndrome_id) + '" data-name="' + esc(s.name || '') + '">就这条开始练</button>' +
          '<button class="syn-ack" data-syn="' + esc(s.syndrome_id) + '">确认指认</button>' +
          '<button class="syn-exclude" data-syn="' + esc(s.syndrome_id) + '">排除</button>';
      }
      html += '</div>';
    });
    html += '<div class="dactions">' +
      '<button data-act="redone" class="ghost">换个片段再诊断</button>' +
      '</div>';
    div.innerHTML = html;
    Array.prototype.forEach.call(div.querySelectorAll('.syn-practice'), function (btn) {
      btn.onclick = function () { startPractice(btn.getAttribute('data-syn'), btn.getAttribute('data-name')); };
    });
    Array.prototype.forEach.call(div.querySelectorAll('.syn-ack'), function (btn) {
      btn.onclick = function () { ackSyndrome(btn); };
    });
    Array.prototype.forEach.call(div.querySelectorAll('.syn-exclude'), function (btn) {
      btn.onclick = function () { excludeSyndrome(btn); };
    });
    div.querySelector('[data-act="redone"]').onclick = resetForNewFragment;
    chatEl.appendChild(div);
    scrollBottom();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // ── 流程动作 ────────────────────────────────────────────
  // 开始练：真模型轮（training 组装链注入技法 L3，模型布置练习任务）
  // 练习发话文本（纯函数，供 selftest 断言防回归）：
  // 对齐 App 先例（chat_self_practice taskDescription 只用名称）——
  // syndrome_id 是内部键，不进学习者可见文本（2026-11-12 舰长指出 P012 泄漏批）。
  function buildPracticeText(syndromeId, syndromeName) {
    var label = syndromeName || syndromeId;
    return '我想针对「' + label + '」这条开始练习，给我布置一个针对性练习任务。';
  }
  function startPractice(syndromeId, syndromeName) {
    if (!syndromeId || sending) return;
    state.focusId = syndromeId;
    state.subphase = 'PRACTICE';
    saveConvoState(curId, state);
    sendCore(buildPracticeText(syndromeId, syndromeName), { practiceTurn: true });
  }

  // 换个片段再诊断：清训练态，下一轮强制走诊断（含协议后缀）
  function resetForNewFragment() {
    state.activeSyndromes = [];
    state.focusId = null;
    state.subphase = null;
    state.forceSceneFirst = true;
    saveConvoState(curId, state);
    addBubble('assistant', '好，把下一段贴过来，我们重新看。', 'think');
  }

  // ── 发送主链 ────────────────────────────────────────────
  // opts.practiceTurn：练习任务轮（不切子相，user 消息由本轮统一入历史）
  // opts.skipUserBubble：重试时不重复画用户气泡
  async function sendCore(text, opts) {
    opts = opts || {};
    if (sending) return;
    if (!opts.practiceTurn && !text) return;
    sending = true; sendEl.disabled = true;
    if (!opts.skipUserBubble) addBubble('user', text);
    // 状态机推进：P0 → 首次贴文进 P1；PRACTICE 提交重写 → FEEDBACK
    if (!opts.practiceTurn) {
      if (state.phase === 'P0') { state.phase = 'P1'; }
      else if (state.phase === 'P2' && state.subphase === 'PRACTICE') {
        state.subphase = 'FEEDBACK';
      }
    }
    var thinkBubble = addBubble('assistant', '月笙正在读', 'think');
    thinkBubble.innerHTML = '月笙正在读<span class="typing">…</span>';
    var full = '';
    var streamOn = false, lastPaint = 0;
    function paintStream(force) {
      var now = Date.now();
      if (!force && now - lastPaint < 120) return;
      lastPaint = now;
      // 流式期间只画正文（parseReply 剥掉诊断块，防卡片 JSON 闪现）
      thinkBubble.innerHTML = renderMd(parseReply(full).prose);
    }
    try {
      var asm = assembleMessages(state, text);
      state.forceSceneFirst = false;
      var payload = {
        endpoint: WB_CONFIG.endpoint,
        publishableKey: WB_CONFIG.publishableKey,
        model: WB_CONFIG.model,
        maxTokens: 4096,
        messages: asm.messages.map(function (m) { return { role: m.role, content: m.content }; }),
      };
      var raw = await window.WbcsBridge.chat(JSON.stringify(payload), function (delta) {
        if (!delta) return;
        full += delta;
        if (!streamOn) { streamOn = true; thinkBubble.className = 'bubble md'; thinkBubble.innerHTML = ''; }
        paintStream(false);
      });
      var r = JSON.parse(raw);
      if (!r.ok) {
        thinkBubble.className = 'bubble err';
        thinkBubble.innerHTML = esc(friendlyError(r));
        var rbtn = document.createElement('button');
        rbtn.className = 'retry-btn';
        rbtn.textContent = '重试';
        rbtn.onclick = function () {
          rbtn.closest('.msg').remove();
          sendCore(text, Object.assign({}, opts, { skipUserBubble: true }));
        };
        thinkBubble.appendChild(rbtn);
        selfreport({ where: 'send', ok: false, code: r.code, phase: state.phase, subphase: state.subphase, practiceTurn: !!opts.practiceTurn });
      } else {
        var parsed = parseReply(r.text || '');
        thinkBubble.className = 'bubble md';
        thinkBubble.innerHTML = renderMd(parsed.prose || '（模型未返回正文）');
        selfreport({ where: 'send', ok: true, proseLen: (parsed.prose || '').length,
                     hasDiag: !!parsed.diagnosis, syndromes: parsed.diagnosis ? (parsed.diagnosis.syndromes || []).map(function (s) { return s.syndrome_id; }) : [],
                     phase: state.phase, subphase: state.subphase, practiceTurn: !!opts.practiceTurn,
                     deltasSeen: streamOn, prose: (parsed.prose || '').slice(0, 300) });
        state.history.push({ role: 'user', content: text });
        state.history.push({ role: 'assistant', content: parsed.prose || '' });
        if (parsed.diagnosis) {
          // 结构化后校验（§4-510 新待裁 · 舰长 2026-11-12 22:09「剩下的都批」）：
          // 100 字基线的硬保证——材料 = 本会话最长用户消息（含本轮触发消息）。
          // <100 字且模型仍输出症候 ⇒ 拦截：卡不渲染 / 不入历史 / 不发 diagnosed /
          // 不推进状态机（prose 保留）。overall-only 诚实卡不受此闸（无症候 ≠ 诊断结论）。
          // prompt 级边界依从是概率性的（§4-510 观察），此闸为渲染面硬保证。
          var materialLen = text.length;
          state.history.forEach(function (m) {
            if (m.role === 'user' && m.content.length > materialLen) materialLen = m.content.length;
          });
          var diagBlocked = materialLen < 100 && (parsed.diagnosis.syndromes || []).length > 0;
          if (diagBlocked) {
            selfreport({ where: 'diag_gate', blocked: true, materialLen: materialLen,
                         syndromes: (parsed.diagnosis.syndromes || []).length, phase: state.phase });
          } else {
            state.history.push({ role: 'assistant', content: '__CARD__' + JSON.stringify(parsed.diagnosis) });
            renderDiagnosisCard(parsed.diagnosis);
            var d = parsed.diagnosis;
            state.activeSyndromes = (d.syndromes || []).map(function (s) { return s.syndrome_id; }).filter(Boolean);
            sendEvent('diagnosed', { syndromes: state.activeSyndromes });
            var sug = d.suggested_phase;
            if (sug) {
              sug = String(sug).trim().toUpperCase().replace('P2_PRACTICE_LOOP', 'P2');
              sug = PHASE_ORDER.includes(sug) ? sug : null;
              var res = applyPhaseSuggestion(state.phase, sug);
              if (res.changed) { state.phase = res.phase; }
              if (res.note) addBubble('assistant', '（' + res.note + '）', 'think');
            }
            if (state.phase === 'P2' && !state.subphase) state.subphase = 'DIAGNOSIS';
          }
        } else if (!opts.practiceTurn && state.subphase === 'FEEDBACK') {
          // 反馈完成 → 下一轮诊断
          state.subphase = 'DIAGNOSIS';
          addBubble('assistant', '这一轮练习到此。想继续，就贴下一段原文；想沉淀，可以让我复盘这段的得失。', 'think');
        }
        saveConvoState(curId, state);
        touchConvo();
      }
    } catch (e) {
      thinkBubble.className = 'bubble err';
      thinkBubble.textContent = '调用失败：' + (e && e.message ? e.message : String(e));
    }
    sending = false; sendEl.disabled = false;
  }

  function friendlyError(r) {
    if (r.code === 'quota_rate_limited') return '平台额度限流了，稍等一两分钟再试。';
    if (r.code === 'quota_exhausted') return '本月平台免费额度已用完，下月恢复。';
    if (r.code === 'access_denied') return '当前访问域名未在平台白名单（部署配置问题，与你的内容无关）。';
    return '调用失败（' + (r.code || r.errorName || '未知') + '）：' + (r.message || '稍后再试。');
  }

  function greet() {
    addBubble('assistant',
      '我是月笙。把你想改的一段文字贴进来，我先读场景、再给条目式诊断：问题在哪、读者为什么会困惑。写得好在哪，我也会说。\n\n（无需注册，不用配 API Key；对话内容只存在你自己的浏览器里，不保存到云端，但会发送给模型服务处理。）');
  }

  // ── 侧栏交互 ────────────────────────────────────────────
  document.getElementById('newConvo').onclick = function () { newConversation(false); };
  document.getElementById('menuBtn').onclick = function () {
    document.body.classList.toggle('sidebar-open');
  };
  document.getElementById('scrim').onclick = closeSidebar;
  function closeSidebar() { document.body.classList.remove('sidebar-open'); }

  sendEl.onclick = send;
  function send() {
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendCore(text);
  }
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault(); send();
    }
  });
  inputEl.addEventListener('input', function () {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
  });

  // ── 启动 ────────────────────────────────────────────────
  (function boot() {
    // selftest 清场参数：全新存储环境跑走查
    if (SELFTEST && location.search.indexOf('clean=1') !== -1) {
      try { localStorage.clear(); } catch (_) {}
    }
    // 旧版单会话迁移（一次性）：有旧状态则转成一条对话
    var legacy = null;
    try {
      var raw = localStorage.getItem(LEGACY_KEY);
      if (raw) { var s = JSON.parse(raw); if (s && s.phase) legacy = s; }
    } catch (_) {}
    if (legacy) {
      try { localStorage.removeItem(LEGACY_KEY); } catch (_) {}
      var l = listConvos();
      if (!l.length) {
        var id = Date.now().toString(36) + 'legacy';
        l.unshift({ id: id, title: '上次会话', createdAt: Date.now(), updatedAt: Date.now() });
        saveConvos(l);
        try { localStorage.setItem(convoKey(id), JSON.stringify(legacy)); } catch (_) {}
      }
    }
    var l = listConvos();
    var act = getActiveId();
    var found = act && l.some(function (c) { return c.id === act; });
    if (!l.length) {
      newConversation(true);
      greet();
    } else {
      curId = found ? act : l[0].id;
      setActiveId(curId);
      state = loadConvoState(curId);
      renderList();
      renderHistory();
    }
    selfreport({ where: 'boot', selftest: SELFTEST, convos: listConvos().length, active: curId, historyLen: state.history.length });
    // ── selftest 门控：页内走查对话列表操作（真实触发同一批 onclick）──
    if (SELFTEST) setTimeout(runSelfTest, 100);
    async function runSelfTest() {
      var rep = { where: 'convo_ops' };
      try {
        // ⓪ 防重复：连点两次新建，空白对话至多一条
        var before = listConvos().length;
        document.getElementById('newConvo').click();
        document.getElementById('newConvo').click();
        var empties = listConvos().filter(function (c) {
          return c.title === '新对话' && !loadConvoState(c.id).history.length;
        });
        rep.dupBlocked = empties.length === 1 && listConvos().length <= before + 1;
        // ① 真新建：先把当前空对话标记为非空
        if (!state.history.length) {
          state.history.push({ role: 'user', content: '铺垫消息' });
          saveConvoState(curId, state);
          touchConvo();
        }
        var n0 = listConvos().length;
        document.getElementById('newConvo').click();
        rep.newAdds = listConvos().length - n0;                 // 期望 1
        rep.newActiveIsCur = getActiveId() === curId;           // 期望 true
        rep.greetBubbles = chatEl.querySelectorAll('.bubble').length; // 期望 ≥1
        // ② 首条用户消息 → 标题取前 20 字（重置标题以复验提取）
        state.history.push({ role: 'user', content: '春风吹过空荡的操场，她把没写完的信折好放进书包。' });
        var l2 = listConvos();
        for (var i = 0; i < l2.length; i++) { if (l2[i].id === curId) l2[i].title = '新对话'; }
        saveConvos(l2);
        saveConvoState(curId, state);
        touchConvo();
        var cur = listConvos().filter(function (c) { return c.id === curId; })[0];
        rep.titleFromFirstMsg = cur && cur.title.indexOf('春风吹过空荡的操场') === 0; // 期望 true
        // ③ 切换回上一条对话（真实 click 列表项）
        var other = listConvos().filter(function (c) { return c.id !== curId; })[0];
        if (other) {
          var prevId = curId;
          var item = listEl.querySelector('.convo-item[data-id="' + other.id + '"]');
          item.click();
          rep.switched = curId === other.id && prevId !== curId;             // 期望 true
          rep.stateRestored = loadConvoState(curId).phase === 'P0';          // 期望 true

          var delBtn = listEl.querySelector('.del[data-del="' + prevId + '"]');
          delBtn.click();
          rep.deleted = listConvos().length === 1;                            // 期望 true
          rep.fellBackToRemaining = curId === other.id;                       // 期望 true
        }
        // ⑤ 抽屉开关（真实 click）
        document.getElementById('menuBtn').click();
        rep.drawerOpens = document.body.classList.contains('sidebar-open');   // 期望 true
        document.getElementById('scrim').click();
        rep.drawerCloses = !document.body.classList.contains('sidebar-open'); // 期望 true
        // ── 伪输出渲染验证（条目信息 mock，不真调用）──
        var mockDiag = {
          overall: { verdict: '场景成立，但叙述停在表面动作', coverage: '覆盖全段',
                     keep: '「折好放进书包」的动作细节有画面感' },
          suggested_phase: 'P2',
          syndromes: [
            { syndrome_id: 'P012', name: '情绪直陈', severity: 'L2',
              evidence: ['心里涌起一股莫名的悲伤'],
              explanation: '悲伤被直接说出，读者只能接收结论，</div><script>window.__xss=1<\/script>无法自行体会',
              reader_impact: '读者被剥夺了自行体会的空间' },
            { syndrome_id: 'P003', name: '视角漂移', severity: 'L1',
              evidence: ['他站在教室门口', '看着她的背影远去'],
              explanation: '一段之内镜头在两个人之间来回切换',
              reader_impact: '轻微，句子尚连贯' },
            { syndrome_id: 'P021', name: '目的先行', severity: 'L3',
              evidence: ['她把没写完的信折好放进书包，转身走向教学楼。', '心里涌起一股莫名的悲伤', '他站在教室门口'],
              explanation: '所有细节都为「离别」服务，没有一个细节越出作者意图',
              reader_impact: '读者提前看到作者底牌，悬念全失' },
          ],
        };
        var mockProse = '先说写得好的地方：「折好放进书包」这个动作有画面感。\n\n但整段几乎每句都在替读者把话说尽 —— & < > " 特殊字符也一并验证。';
        // 清空现场，按真实顺序渲染：prose 气泡 + 诊断卡 + 错误/思考气泡
        chatEl.innerHTML = '';
        addBubble('user', '春风吹过空荡的操场……');
        addMdBubble('assistant', mockProse);
        renderDiagnosisCard(mockDiag);
        addBubble('assistant', '（进入针对性练习。围绕「P012」……）', 'think');
        var errB = addBubble('assistant', 'x', 'err'); errB.textContent = '平台额度限流了，稍等一两分钟再试。';
        var cards = chatEl.querySelectorAll('.dcard');
        rep.r = {
          cardCount: cards.length,                                            // 期望 1
          syndCount: chatEl.querySelectorAll('.synd').length,                 // 期望 3
          synBtnCount: chatEl.querySelectorAll('.syn-practice').length,       // 期望 3（逐条可练）
          sevL1: chatEl.querySelectorAll('.sev.L1').length,                   // 期望 1
          sevL2: chatEl.querySelectorAll('.sev.L2').length,                   // 期望 1
          sevL3: chatEl.querySelectorAll('.sev.L3').length,                   // 期望 1
          evidCount: chatEl.querySelectorAll('.synd .evid').length,           // 期望 6（各条截前 3）
          scriptInjected: chatEl.querySelectorAll('script').length,           // 期望 0（esc 生效）
          xssFired: !!window.__xss,                                           // 期望 false
          escTextOk: cards[0].textContent.indexOf('<script>') !== -1,         // 期望 true（作纯文本可见）
          bubbleCount: chatEl.querySelectorAll('.msg').length,                // 期望 4（重绘后 user+正文+练习提示 3 气泡；卡片非 .msg）
          practiceBtn: !!cards[0].querySelector('.syn-practice'),             // 期望 true
        };
        // ── Markdown 渲染 + 消毒断言 ──
        var mdBox = document.createElement('div');
        mdBox.innerHTML = renderMd('**加粗**标题\n\n- 甲\n- 乙\n\n<script>window.__mdxss=1<\/script><img src=x onerror="window.__mdxss2=1">');
        rep.r.mdStrong = mdBox.innerHTML.indexOf('<strong>加粗</strong>') !== -1;   // 期望 true
        rep.r.mdList = mdBox.querySelectorAll('li').length;                         // 期望 2
        rep.r.mdScriptStripped = mdBox.querySelectorAll('script').length;           // 期望 0
        rep.r.mdOnerrorStripped = mdBox.querySelectorAll('[onerror]').length;       // 期望 0
        rep.r.mdXssFired = !window.__mdxss && !window.__mdxss2;                     // 期望 true
        rep.r.mdBenignKept = renderMd('<b>强调</b>').indexOf('<b>强调</b>') !== -1;  // 期望 true（良性标签保留）
        // ── 教学环 payload 断言（真 assembleMessages，不调用模型）──
        var pst = initialState(); pst.phase = 'P2'; pst.subphase = 'PRACTICE'; pst.focusId = 'P001';
        var pasm = assembleMessages(pst, '我的重写段落。');
        rep.r.practiceL2Mode = pasm.l2Mode;                                          // 期望 'training'
        rep.r.practiceTechL3 = pasm.messages.some(function (m) {
          return m.content.indexOf('聚焦技法详细内容') !== -1; });                     // 期望 true（正则修复后）
        rep.r.practiceSyndL3 = pasm.messages.some(function (m) {
          return m.content.indexOf('活跃症候详细定义') !== -1; });                    // 期望 true
        rep.r.practiceUserClean = pasm.messages[pasm.messages.length - 2]
          .content.indexOf('[YS_DIAGNOSIS]') === -1;                                 // 期望 true（练习轮无协议后缀）
        // ── 换片段清态断言 ──
        state.activeSyndromes = ['P001', 'P003']; state.focusId = 'P001';
        state.subphase = 'FEEDBACK'; state.forceSceneFirst = false;
        resetForNewFragment();
        rep.r.resetClears = state.activeSyndromes.length === 0 && state.focusId === null &&
                            state.subphase === null && state.forceSceneFirst === true; // 期望 true
        // ── sendCore 错误→重试→成功 全链（fake bridge，零额度消耗）──
        var realBridge = window.WbcsBridge;
        chatEl.innerHTML = '';                       // 清现场：链路断言只看本轮
        state = initialState(); saveConvoState(curId, state);
        window.WbcsBridge = { chat: function () {
          return Promise.resolve(JSON.stringify({ ok: false, code: 'quota_rate_limited' }));
        } };
        // 重试链路素材 125 字（≥100）——§4-510 后校验闸放行，保住 retryCardCount=1 判据
        var retryText = '重试链路测试片段。天黑之后他站在门边，手心全是汗，迟迟没有推开那扇门；直到身后有人轻轻喊了他的名字，他才回头看了一眼，又很快把目光挪开了，像是在害怕什么。他听见自己的呼吸很重，心跳得厉害，可他不想承认这份紧张，只是把双手插进口袋，装作若无其事地等着。';
        await sendCore(retryText, {});
        rep.r.errShown = !!chatEl.querySelector('.retry-btn');                       // 期望 true
        // 用户气泡应恰好一条（错误不入历史）
        rep.r.userOnce = Array.prototype.filter.call(chatEl.querySelectorAll('.msg.user'), function (el) {
          return el.textContent.indexOf('重试链路测试片段') !== -1; }).length;        // 期望 1
        // fake 成功回复（含 md + 诊断块）
        var fakeOk = '改后的版本读者能看见了。**重点**在这里。\n\n[YS_DIAGNOSIS]\n{"syndromes":[{"syndrome_id":"P001","name":"情绪标签化","severity":"L2","evidence":["他很愤怒"],"explanation":"告知而非展示","reader_impact":"读者被告知情绪"}],"suggested_phase":"P2","overall":{"verdict":"可改"}}\n[/YS_DIAGNOSIS]';
        window.WbcsBridge = { chat: function (p, cb) { cb('假流式增量'); return Promise.resolve(JSON.stringify({ ok: true, text: fakeOk })); } };
        chatEl.querySelector('.retry-btn').click();
        await new Promise(function (res) { setTimeout(res, 300); });
        rep.r.retryClearedErr = !chatEl.querySelector('.retry-btn');                 // 期望 true
        rep.r.retryMdStrong = Array.prototype.some.call(chatEl.querySelectorAll('.bubble.md'), function (b) {
            return b.innerHTML.indexOf('<strong>重点</strong>') !== -1; });           // 期望 true（流式后 md 渲染）
        rep.r.retryCardCount = chatEl.querySelectorAll('.dcard').length;             // 期望 1（假诊断卡）
        rep.r.retryHistUser = state.history.filter(function (m) {
          return m.role === 'user' && m.content === retryText; }).length;             // 期望 1（重试不重复入历史）
        rep.r.retryHistAsst = state.history.filter(function (m) {
          return m.role === 'assistant' && m.content.indexOf('改后的版本读者能看见了') === 0; }).length; // 期望 1
        rep.r.retryCardMark = state.history.filter(function (m) {
          return m.role === 'assistant' && m.content.indexOf('__CARD__') === 0; }).length; // 期望 1
        rep.r.retryStateP2 = state.phase === 'P2' && state.subphase === 'DIAGNOSIS';  // 期望 true（P1→P2 推进）
        window.WbcsBridge = realBridge;
        // ── 空卡壳抑制断言（§4-509 残留待裁 · 舰长 2026-11-12 22:0x 批）：无症候∧无排除∧
        //    无整体判定的全空协议块不渲染壳；带 overall.verdict 的诚实卡保留（可变红判据）──
        chatEl.innerHTML = '';
        renderDiagnosisCard({ syndromes: [], excluded: [], overall: {} });
        rep.r.emptyShellSuppressed = chatEl.querySelectorAll('.dcard').length === 0;  // 期望 true
        renderDiagnosisCard({ syndromes: [], excluded: [], overall: { verdict: '无文本，未进入诊断' } });
        rep.r.honestCardKept = chatEl.querySelectorAll('.dcard').length === 1;        // 期望 true
        chatEl.innerHTML = '';
        // ── 结构化后校验断言（§4-510 后校验 · 舰长 2026-11-12 22:09 批）：
        //    材料 <100 且模型出症候 ⇒ 卡拦截（不渲染/不入历史）；材料 ≥100 ⇒ 正常出卡。
        //    可变红判据：拆掉 sendCore 内 diagBlocked 闸即双红。──
        state = initialState(); saveConvoState(curId, state);
        var shortDiag = '改后的版本读者能看见了。\n\n[YS_DIAGNOSIS]\n{"syndromes":[{"syndrome_id":"P001","name":"情绪标签化","severity":"L2","evidence":["他很愤怒"],"explanation":"告知而非展示"}],"overall":{"verdict":"可改"}}\n[/YS_DIAGNOSIS]';
        window.WbcsBridge = { chat: function (p, cb) { cb('增量'); return Promise.resolve(JSON.stringify({ ok: true, text: shortDiag })); } };
        await sendCore('太短了。', {});
        rep.r.shortMatGateBlocks = chatEl.querySelectorAll('.dcard').length === 0 &&
          !state.history.some(function (m) {
            return m.role === 'assistant' && m.content.indexOf('__CARD__') === 0; });  // 期望 true
        var longTail = '他站在门边，手心全是汗，迟迟没有推开那扇门；直到身后有人轻轻喊了他的名字，他才回头看了一眼，又很快把目光挪开了，像是在害怕什么。他听见自己的呼吸很重，心跳得厉害，可他不想承认这份紧张，只是把双手插进口袋，装作若无其事地等着，门里的人却始终没有出声。';
        await sendCore(longTail, {});
        rep.r.longMatCardOk = chatEl.querySelectorAll('.dcard').length === 1 &&       // 期望 1（长材料放行）
          state.history.some(function (m) {
            return m.role === 'assistant' && m.content.indexOf('__CARD__') === 0; });  // 期望 true（入历史）
        chatEl.innerHTML = '';
        window.WbcsBridge = realBridge;
        // ── 私有标记防线断言（练习轮真用户消息入历史，__ 标记不发给模型）──
        rep.r.markerFiltered = (function () {
          var st2 = initialState();
          st2.history = [
            { role: 'user', content: '片段' },
            { role: 'assistant', content: '__CARD__{"x":1}' },
            { role: 'assistant', content: '__CARD_PRACTICE__P001' },
            { role: 'assistant', content: '正常回复' },
          ];
          var a = assembleMessages(st2, '继续');
          var dump = JSON.stringify(a.messages);
          return a.messages.filter(function (m) { return m.role === 'user'; }).length === 2 &&
                 dump.indexOf('__CARD__') === -1 && dump.indexOf('__CARD_PRACTICE__') === -1;
        })();
        // ── 伪输出渲染验证持久化重绘：按 send() 同款写入历史 → 切走再切回 → 卡片应重建
        state.history = [
          { role: 'user', content: '春风吹过空荡的操场……' },
          { role: 'assistant', content: mockProse },
          { role: 'assistant', content: '__CARD__' + JSON.stringify(mockDiag) },
          { role: 'assistant', content: '进入针对性练习，贴出你的重写段落。' },
        ];
        saveConvoState(curId, state);
        var backId = curId;
        newConversation(true);   // 建一条可切换目标（此时无空白对话 ⇒ 真新建）
        switchConvo(backId);
        rep.r.redrawCards = chatEl.querySelectorAll('.dcard').length;       // 期望 1
        rep.r.redrawBubbles = chatEl.querySelectorAll('.msg').length;       // 期望 3
        rep.r.xssStillSafe = !window.__xss && chatEl.querySelectorAll('script').length === 0;
        // ── 埋点按钮三例（正 / 负 / 防误删；计数假桥捕获 insertEvent，零云写入）──
        // 现场即上一步重绘后的 mockDiag 卡（P012 / P003 / P021 三症候，各带 ack/exclude）。
        var evCaptured = [];
        window.WbcsBridge = { chat: realBridge.chat, insertEvent: function (s) { evCaptured.push(JSON.parse(s)); } };
        var row1 = chatEl.querySelectorAll('.synd')[0];
        var row2 = chatEl.querySelectorAll('.synd')[1];
        var row3 = chatEl.querySelectorAll('.synd')[2];
        rep.r.ackBtnCount = chatEl.querySelectorAll('.syn-ack').length;      // 期望 3（防误删：渲染面在位）
        rep.r.exclBtnCount = chatEl.querySelectorAll('.syn-exclude').length; // 期望 3
        // ① 正例：selftest 门控临时放开 ⇒ 真点按必须走到 insertEvent 且事件形状正确
        SELFTEST = false;
        row1.querySelector('.syn-ack').click();
        row2.querySelector('.syn-exclude').click();
        SELFTEST = true;
        var ackRow = evCaptured[0] && evCaptured[0].row, exclRow = evCaptured[1] && evCaptured[1].row;
        rep.r.ackEventOk = !!(ackRow && evCaptured[0].table === 'interaction_events' &&
          ackRow.event_type === 'anchor_ack' && ackRow.payload.syndrome_id === row1.querySelector('.syn-ack').getAttribute('data-syn') &&
          ackRow.source === 'web' && ackRow.session_tag === curId && !!ackRow.client_created_at);
        rep.r.exclEventOk = !!(exclRow && evCaptured[1].table === 'interaction_events' &&
          exclRow.event_type === 'exclusion' && exclRow.payload.syndrome_id === row2.querySelector('.syn-exclude').getAttribute('data-syn') &&
          exclRow.source === 'web' && exclRow.session_tag === curId);
        // ② 负例：selftest 门控恢复 ⇒ 再点按不得写入（防污染统计）
        var nEv = evCaptured.length;
        row3.querySelector('.syn-exclude').click();
        rep.r.selftestGuardBlocks = evCaptured.length === nEv;               // 期望 true
        // ③ 互斥与防误删：确认指认后对侧禁用、练习钮不受牵连；排除同理
        var ack1 = row1.querySelector('.syn-ack'), excl1 = row1.querySelector('.syn-exclude'), prac1 = row1.querySelector('.syn-practice');
        var excl2 = row2.querySelector('.syn-exclude'), ack2 = row2.querySelector('.syn-ack');
        rep.r.ackMutex = ack1.disabled && ack1.textContent.indexOf('已确认指认') !== -1 &&
                         excl1.disabled && !prac1.disabled;                  // 期望 true
        rep.r.exclMutex = excl2.disabled && excl2.textContent.indexOf('已排除') !== -1 &&
                          ack2.disabled && row2.querySelector('.syn-practice') &&
                          !row2.querySelector('.syn-practice').disabled;     // 期望 true
        window.WbcsBridge = realBridge;
        // ── 编号防泄漏断言（2026-11-12 舰长指出 P012 暴露批）：syndrome_id 是内部键，
        //    卡片与练习发话都不得把它带进学习者可见文本（对齐 App diagnosis_card 只渲染 name）
        rep.r.cardIdHidden = cards[0].textContent.indexOf('P012') === -1 &&
                             cards[0].textContent.indexOf('情绪直陈') !== -1;   // 期望 true
        var ptxt = buildPracticeText('P012', '情绪直陈');
        rep.r.practiceTextClean = ptxt.indexOf('P0') === -1 &&
                                  ptxt.indexOf('情绪直陈') !== -1;              // 期望 true
        // 视觉快照：真实渲染 DOM + 样式回传（供离线组装快照页）
        rep.snapshot = {
          css: document.querySelector('style').textContent,
          chat: chatEl.outerHTML,
        };
      } catch (e) {
        rep.error = String(e && e.message || e);
      }
      selfreport(rep);
    }
  })();
})();

<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<title>月笙 — 写作教练 V6.2 (技法目录+后端对齐)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');
:root{--accent:#7A6040;--accent-hover:#6A5030;--success:#5A8F68;--warn:#C8943C;--danger:#B84A4A}
*{box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}
.font-serif{font-family:'Noto Serif SC','Songti SC',serif}
.cscroll::-webkit-scrollbar{width:4px}
.cscroll::-webkit-scrollbar-track{background:transparent}
.cscroll::-webkit-scrollbar-thumb{background:#C8BFB0;border-radius:999px}
.scrollbar-none::-webkit-scrollbar{display:none}
.scrollbar-none{-ms-overflow-style:none;scrollbar-width:none}
.small-scroll::-webkit-scrollbar{height:2px}
.small-scroll::-webkit-scrollbar-track{background:transparent}
.small-scroll::-webkit-scrollbar-thumb{background:#C8BFB0;border-radius:999px}
.panel-trans{transition:width 220ms cubic-bezier(0.22,1,0.36,1)}
#appRoot.rc #rCollBar{display:flex}
#appRoot:not(.rc) #rCollBar{display:none}
#appRoot.rc #cHdrActions{display:none}
#appRoot.lc #leftPanel{width:0!important;min-width:0!important;overflow:hidden;border-right-color:transparent}
#appRoot.rc #rightPanel{width:0!important;min-width:0!important;overflow:hidden;border-left-color:transparent}
.lc-collapsed-left{display:none}
#appRoot.lc .lc-collapsed-left{display:flex;align-items:center;gap:6px;margin-right:6px}
.ts:not(:last-child)::after{content:'';position:absolute;left:8px;top:23px;bottom:0;width:1px;background:#D6CEC0}
.st-badge{transition:all 150ms ease}
.st-badge{color:#C8943C;border-color:rgba(200,148,60,.3);background:rgba(200,148,60,.07)}
.st-badge .dot{background:#C8943C}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.popup-enter{animation:popIn 150ms cubic-bezier(0.22,1,0.36,1) both}
.btn-press:active{transform:scale(0.94)}
.resize-handle{width:4px;cursor:col-resize;flex-shrink:0;background:transparent;transition:background 150ms;position:relative;z-index:5}
.resize-handle:hover,.resize-handle.dragging{background:#7A6040}
.resize-handle[data-side=left]{margin-right:-2px}
.resize-handle[data-side=right]{margin-left:-2px}
#appRoot.dragging *{user-select:none!important}
#appRoot.dragging .panel-trans{transition:none!important}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="h-dvh w-screen flex overflow-hidden bg-[#F0EDE6]" id="appRoot">

</div>

  <!-- ===== LEFT PANEL ===== -->

    <div class="px-2.5 py-2 flex-shrink-0">

          <div class="w-[26px] h-[26px] rounded bg-[#7A6040] text-white flex items-center justify-center text-[13px] font-bold font-serif flex-shrink-0">月</div>
          <button id="expandLeftBtn" class="w-[22px] h-[22px] flex items-center justify-center rounded text-[#8A7F6E] hover:text-[#7A6040] hover:bg-[rgba(122,96,64,0.09)] text-[11px] transition-colors btn-press">☰</button>

        <span id="trainBadge" class="hidden inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] border border-[rgba(200,148,60,.3)] text-[#C8943C] bg-[rgba(200,148,60,.07)]"><span class="w-1.5 h-1.5 rounded-full bg-[#C8943C]"></span>训练</span>

        <button class="w-[22px] h-[22px] flex items-center justify-center rounded text-[#8A7F6E] hover:text-[#7A6040] hover:bg-[rgba(122,96,64,0.09)] text-[11px] transition-colors btn-press" onclick="openTool('__settings__')" title="设置">⚙</button>

    <div class="flex-1 overflow-y-auto cscroll px-5 pb-3" id="centerBody"></div>

        <div class="flex items-center gap-1">

            <button class="att-l w-[10px] h-[10px] rounded-full border-2 border-[#C8943C] bg-transparent transition-transform" data-lv="yuesheng"></button>
            <button class="att-l w-[10px] h-[10px] rounded-full border-2 border-[#B84A4A] bg-transparent transition-transform" data-lv="sensei"></button>
          </div>
          <button id="lockBtn" class="text-[10px] text-[#8A7F6E] px-0.5 py-0.5 rounded hover:text-[#5C5242] transition-colors" title="锁定">🔓</button>

      </div>
    </footer>
  </main>
  <div class="resize-handle" data-side="right" title="拖拽调整右栏宽度"></div>

  <!-- ===== RIGHT PANEL ===== -->
  <aside id="rightPanel" class="panel-trans w-[360px] min-w-0 flex-shrink-0 bg-[#E8E3DA] border-l border-[#D6CEC0] flex flex-col overflow-hidden" style="width:360px">
    <div class="flex items-center gap-0.5 px-1.5 py-0.5 min-h-[32px] border-b border-[#D6CEC0] flex-shrink-0 overflow-hidden" id="rightHdr">
      <div class="flex items-center gap-0.5 flex-1 min-w-0 overflow-x-auto mx-1 scrollbar-none" id="toolTabs"></div>
      <div class="flex items-center gap-0.5 flex-shrink-0">
        <button class="w-[22px] h-[22px] flex items-center justify-center rounded text-[#8A7F6E] hover:text-[#7A6040] hover:bg-[rgba(122,96,64,0.09)] text-[11px] transition-colors flex-shrink-0 btn-press" id="addToolBtn" title="添加工具">＋</button>
        <button class="w-[22px] h-[22px] flex items-center justify-center rounded text-[#8A7F6E] hover:text-[#7A6040] hover:bg-[rgba(122,96,64,0.09)] text-[11px] transition-colors btn-press" id="collapseRightBtn">⤢</button>
        <button class="w-[22px] h-[22px] flex items-center justify-center rounded text-[#8A7F6E] hover:text-[#7A6040] hover:bg-[rgba(122,96,64,0.09)] text-[11px] transition-colors btn-press">─</button>
        <button class="w-[22px] h-[22px] flex items-center justify-center rounded text-[#8A7F6E] hover:text-[#7A6040] hover:bg-[rgba(122,96,64,0.09)] text-[11px] transition-colors btn-press">□</button>
        <button class="w-[22px] h-[22px] flex items-center justify-center rounded text-[#8A7F6E] hover:bg-[#B84A4A] hover:text-white text-[11px] transition-colors btn-press">✕</button>
      </div>
    </div>
    <div id="rightSubHdr" class="flex items-center gap-0.5 px-1.5 py-1 border-b border-[#D6CEC0] flex-shrink-0 min-h-[32px] small-scroll">
      <div class="flex-1 flex items-center gap-0.5 min-w-0 overflow-x-auto small-scroll" id="subTabs"></div>
      <button class="flex-shrink-0 w-[18px] h-[18px] flex items-center justify-center rounded text-[#8A7F6E] hover:text-[#7A6040] hover:bg-[rgba(122,96,64,0.09)] text-[11px] transition-colors btn-press hidden" id="subAddBtn" title="回到目录">＋</button>
    </div>
    <div class="flex-1 overflow-y-auto cscroll p-3" id="rightBody"></div>

<div id="toolPopup" class="hidden fixed bg-[#FAF8F5] border border-[#D6CEC0] rounded-lg shadow-lg p-1 min-w-[130px] z-50" style="top:34px;right:6px"></div>

<script>
// ===== 后端合约对齐的模拟数据 =====

// ——— SessionInfo (session.contract.ts) ———
const SESSIONS = [
  { id:'s1', title:'初稿诊断', createdAt:Date.now()-864e5, updatedAt:Date.now()-36e5, messageCount:14 },
  { id:'s2', title:'第一章节奏讨论', createdAt:Date.now()-1728e5, updatedAt:Date.now()-864e5, messageCount:8 },
  { id:'s3', title:'训练: 动作替代情绪词', createdAt:Date.now()-2592e5, updatedAt:Date.now()-1728e5, messageCount:5 },
  { id:'s4', title:'配角动机梳理', createdAt:Date.now()-4320e5, updatedAt:Date.now()-2592e5, messageCount:11 },
  { id:'s5', title:'训练: 对话节奏', createdAt:Date.now()-6048e5, updatedAt:Date.now()-4320e5, messageCount:3 },
  { id:'s6', title:'训练: 三幕剧结构', createdAt:Date.now()-864e5, updatedAt:Date.now()-4e4, messageCount:7 },
  { id:'s7', title:'训练: 动机层次', createdAt:Date.now()-2592e5, updatedAt:Date.now()-864e5, messageCount:5 },
  { id:'s8', title:'训练: 伏笔回收', createdAt:Date.now()-4320e5, updatedAt:Date.now()-2592e5, messageCount:6 },
  { id:'s9', title:'训练: 视角切换', createdAt:Date.now()-6048e5, updatedAt:Date.now()-432e5, messageCount:6 },
];

// ——— ProjectInfo (project.contract.ts) ———
const PROJECTS = [
  { id:'p1', name:'第一章: 山门', description:'主角进入修仙门派', createdAt:Date.now()-864e6, updatedAt:Date.now()-432e5 },
  { id:'p2', name:'第二章: 试炼', description:'入门考核', createdAt:Date.now()-6048e5, updatedAt:Date.now()-432e5 },
  { id:'p3', name:'第三章: 初遇', description:'与师尊第一次对话', createdAt:Date.now()-432e5, updatedAt:Date.now()-864e4 },
  { id:'p4', name:'第四章: 暗流', description:'门派内部矛盾', createdAt:Date.now()-1728e4, updatedAt:Date.now()-864e4 },
  { id:'p5', name:'大纲', description:null, createdAt:Date.now()-864e6, updatedAt:Date.now()-432e5 },
  { id:'p6', name:'第五章: 抉择', description:'主角面临关键选择', createdAt:Date.now()-864e4, updatedAt:Date.now()-432e4 },
  { id:'p7', name:'第六章: 阴谋', description:'发现幕后黑手', createdAt:Date.now()-432e4, updatedAt:Date.now()-864e3 },
  { id:'p8', name:'人物小传: 师尊', description:null, createdAt:Date.now()-864e6, updatedAt:Date.now()-864e5 },
  { id:'p9', name:'人物小传: 师兄', description:null, createdAt:Date.now()-864e6, updatedAt:Date.now()-6048e5 },
  { id:'p10', name:'世界观设定', description:'修仙体系等级与规则', createdAt:Date.now()-864e6, updatedAt:Date.now()-432e5 },
];

// ——— SyndromeId 常量 (constants.ts) ———
const SYNDROME = {
  P001:'世界观膨胀', P002:'角色工具人化', P003:'情绪标签化',
  P004:'信息硬塞', P005:'视角漂移', P006:'节奏停滞',
};

// ——— 技法目录（来自 technique-library.json · 适配 training:catalog 合约）———
const DIFF_LABEL = { beginner:'入门', intermediate:'进阶', advanced:'高阶' };
const TECHNIQUE_CATALOG = [
  { coreId:'suspense-engine', coreName:'悬念驱动', count:21, techniques:[
    { id:'TQ-002', name:'物件反常法', difficulty:'beginner', category:'开篇', description:'在平铺叙事中突然插入一个"不该出现在这里"的物件，制造读者认知失调。核心不在于物件本身多奇特，而在于它"不应该在这里出现"。' },
    { id:'TQ-003', name:'视觉确认法', difficulty:'beginner', category:'开篇', description:'先用模糊信息制造悬念，再让角色通过视觉核实来揭示真相。视觉确认即悬念消解的时刻，这个时刻越意外，悬念效力越强。' },
    { id:'TQ-004', name:'证据链式悬念', difficulty:'intermediate', category:'节奏', description:'多段独立叙述各自埋下细节，后期通过一条链条将它们串起来形成完整揭示。每段都是独立的"可信片段"，合起来才暴露真相。' },
  ]},
  { coreId:'character-depth', coreName:'角色立体化', count:16, techniques:[
    { id:'TC-002', name:'重复台词塑造人物', difficulty:'beginner', category:'人物', description:'让角色在关键场景反复说同一句台词，通过语境的变化揭示角色的内心变迁。同一句话，第一遍是性格标签，第十遍是命运宣言。' },
    { id:'TC-003', name:'一句话情感锚点', difficulty:'beginner', category:'人物', description:'为每个重要角色设计一句"标志性表达"，这个表达既是角色性格的浓缩，也是情感共鸣的触发点。当这句话在关键时刻再次出现时，读者会自动联想起角色的全部故事。' },
    { id:'TC-004', name:'日常反差建立人物', difficulty:'beginner', category:'人物', description:'通过角色在非关键场景中的微小反常规行为来塑造性格。"一个人吃什么、怎么吃"比"一个人面对什么抉择"更能揭示其本质。' },
  ]},
  { coreId:'rhythm-control', coreName:'节奏呼吸', count:12, techniques:[
    { id:'TQ-005', name:'三段式情绪递降', difficulty:'beginner', category:'节奏', description:'在高张力场景后，用一个"三段式递降"让读者逐渐脱离紧张状态：第一段保持张力余韵，第二段过渡到日常语速，第三段彻底放松。' },
    { id:'TQ-041', name:'章节内节奏变速法', difficulty:'beginner', category:'节奏', description:'在一个章节内部通过句子长度和段落密度的变化控制阅读速度。短句短段→加速（动作/危机）；长句长段→减速（内心/描写）。' },
    { id:'TQ-050', name:'仪式锚点法', difficulty:'intermediate', category:'节奏', description:'在关键转折点使用"仪式化场景"作为节奏锚点。仪式本身是慢节奏、高关注度的，能让读者在心理上"标记"这个转折的重要性。' },
  ]},
  { coreId:'worldbuilding-embed', coreName:'设定融入', count:9, techniques:[
    { id:'TC-001', name:'日常行为释放设定', difficulty:'beginner', category:'世界观', description:'通过角色在做日常事时自然流露的信息来完成世界观传递。角色本身已经习惯这个世界的规则，读者通过观察角色的"理所当然"来理解规则。' },
    { id:'TQ-042', name:'设定折旧法', difficulty:'intermediate', category:'世界观', description:'把世界观设定本身当做"会磨损的事物"。让读者看到设定在时间中的变化——同一规则在不同时期被不同地遵守或破坏。' },
    { id:'TQ-043', name:'对话夹带法', difficulty:'intermediate', category:'对话', description:'在角色对话中"夹带"设定信息。关键在于：夹带的设定必须同时推进对话本身——如果删除它对话成立，那就是无效夹带。' },
  ]},
  { coreId:'opening-hook', coreName:'开篇钩子', count:12, techniques:[

"怕了？"林岳抱臂靠在门框上。

"有点。"

林岳难得露出一丝笑意："怕就对了。那个姓赵的去年考核把三个人打成了重伤。不过——"他压低声音，"他有个习惯，出招前会先喊招式名字。"

"这算破绽？"

"在实战里，任何多余动作都是破绽。"林岳说完，转身走了。`,

  p7:`陈远在藏经阁找到了一条线索。

那封未拆的信——他从未和任何人提起过。信是母亲临终前交给他的，让他"等时机到了再打开"。信封上没有落款，只画着一朵莲花图案。

今晚的藏经阁格外安静。陈远坐在角落，盯着手中的信，修长的手指在信封上来回摩挲——时机到了吗？他不知道。

"你手里是什么？"

陈远猛地抬头——沈渊不知何时出现在他身后。

"师、师尊……"

"那封信。"沈渊伸出手，语气不容拒绝。

陈远犹豫了一下，递了过去。沈渊接过信封，看到莲花图案的瞬间，瞳孔骤缩——那个表情只出现了一秒，但陈远看见了。

"这封信你从哪来的？"

"我娘临终前给我的。"

沈渊沉默了很久，最后把信还给陈远："收好。这个秘密，死也不能告诉任何人。"`,

  p8:`# 师尊·沈渊

## 外貌
- 白衣，长发，面若冠玉
- 看起来25岁左右，实际年龄150+
- 左眉梢有一道极淡的剑痕

## 性格
- 表面：懒散、随性、不守规矩
- 内核：极深的忠诚与责任感
- 口头禅："规矩是死的，人是活的"

## 身世（机密）
- 前魔教教主之子，被现任掌门收养
- 莲花印记 = 魔教圣物传人身份
- 入修仙界是为从内部瓦解魔教
- 唯一知情者：掌门、已故的上一任执剑长老、陈远的母亲

## 与陈远的关系
- 第一阶段：好奇(绝壁路) → 欣赏(实战考核) → 信任
- 本阶段：信任已建立，但尚未告知身世`,

  p9:`# 师兄·林岳

## 外貌
- 普通长相，中等身材
- 常年穿着灰色弟子服
- 左手有四根旧伤疤

## 性格
- 表面：冷淡、公事公办
- 内核：热心但不愿承认
- 习惯：说话时喜欢抱臂

## 背景
- 入门十五年，卡在金丹瓶颈
- 曾经也是天才，被赵家打压后沉寂
- 暗中帮助过很多新弟子
- 最早发现王长老贪污灵石的人

## 与陈远的互动
- 测试期：公事公办，保持距离
- 现在：偶尔露出真性情
- 后续：成为陈远在门派内的主要情报来源`,

  p10:`# 修仙世界观设定

## 境界体系
- 练气 → 筑基 → 金丹 → 元婴 → 化神 → 大乘 → 渡劫
- 每个大境界分初期/中期/后期/圆满四小阶
- 渡劫成功则飞升仙界，失败则魂飞魄散

## 宗门结构
- 掌门 → 首座长老(5人) → 执事(若干) → 核心弟子 → 普通弟子 → 外门弟子
- 五堂：戒律堂、丹堂、器堂、藏经阁、外务堂
- 凌霄殿：议事主殿；落月峰：考核场地

## 特殊设定
- 绝壁路：三百三十三阶风化岩壁，心性愈强愈容易通过
- 莲花印记：魔教圣物标记，仙界大战前遗落的信物
- 灵石：既是货币也是修炼资源，分下品/中品/上品/极品`,

var sessionIdCounter = 9;
function createEmptySession() {
  sessionIdCounter++;
  const newId = 's' + sessionIdCounter;
  const now = Date.now();
  SESSIONS.push({ id:newId, title:'新会话', createdAt:now, updatedAt:now, messageCount:0 });
  SESSION_MESSAGES[newId] = [];
  const chatTab = document.querySelector('[data-tab="chat"]');
  if (chatTab) chatTab.click();
  setTimeout(() => { selectChat(newId); }, 50);
}
function createTraining(techName) {
  // §6.3: 选技法 → 新建训练会话 → 自动切到 [对话] tab
  sessionIdCounter++;
  const newId = 's' + sessionIdCounter;
  const title = '训练: ' + techName;

  // H-01: 查找技法信息，确定对话风格
  let techInfo = null;
  let dialogueCategory = '默认';
  for (const g of TECHNIQUE_CATALOG) {
    const found = g.techniques.find(t => t.name === techName);
    if (found) {
      techInfo = { techniqueName:found.name, category:found.category, difficulty:found.difficulty, description:found.description, coreName:g.coreName };
      dialogueCategory = found.category;
      break;
    }
  }
  // 取技法类别对应的对话，没有则用默认
  const dialogue = TRAINING_DIALOGUES[dialogueCategory] || TRAINING_DIALOGUES['默认'];

  // 生成技法特定 mock 对话消息
  const now = Date.now();
  const mockMessages = dialogue.map((m, i) => ({
    id:'m' + (sessionIdCounter * 3 + i),
    sessionId:newId,
    role:m.role,
    content:m.content,
    createdAt:now - (dialogue.length - 1 - i) * 30000, // 每条间隔 30 秒
  }));

  SESSIONS.push({ id:newId, title, createdAt:now, updatedAt:now, messageCount:mockMessages.length });
  SESSION_MESSAGES[newId] = mockMessages;

  // H-01: 存储训练上下文
  if (techInfo) {
    TRAINING_CONTEXTS[newId] = techInfo;
  }

  // 切换到 [对话] tab
  const chatTab = document.querySelector('[data-tab="chat"]');
  if (chatTab) chatTab.click();
  // 选中新会话
  setTimeout(() => { selectChat(newId); }, 50);
}

function timeStr(ts){const d=new Date(ts);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}

function sendMessage() {
  const ta = document.getElementById('chatTextarea');
  const text = ta.value.trim();
  if (!text || !chatSessionId) return;
  const msgs = SESSION_MESSAGES[chatSessionId];
  if (!msgs) return;
  const now = Date.now();
  msgs.push({ id:'m' + Date.now(), sessionId:chatSessionId, role:'user', content:text, createdAt:now });
  // 模拟 AI 回复
  msgs.push({ id:'m' + (Date.now()+1), sessionId:chatSessionId, role:'assistant', content:'收到。我看看这段内容……\n\n有几个地方我们可以重点讨论。你写的作品里，角色的动机表现得比较清晰，但在场景过渡上略有跳跃。你想先聊哪一部分？', createdAt:now+1000 });
  // 更新会话计数
  const session = SESSIONS.find(s => s.id === chatSessionId);
  if (session) { session.messageCount = msgs.length; session.updatedAt = now; }
  ta.value = '';
  document.getElementById('sendBtn').disabled = true;
  renderCenter();
  // 重新渲染列表以更新计数
  renderList();
}
// Enter 键发送（Shift+Enter 换行）
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    const ta = document.getElementById('chatTextarea');
    if (document.activeElement === ta) {
      e.preventDefault();
      sendMessage();
    }
  }
});

// ===== 左右栏拖拽 =====
const MIN_LEFT = 160, MIN_RIGHT = 260;
document.querySelectorAll('.resize-handle').forEach(h => {
  h.addEventListener('mousedown', e => {
    e.preventDefault();
    const side = h.dataset.side;
    const panel = document.getElementById(side === 'left' ? 'leftPanel' : 'rightPanel');
    body.classList.add('dragging');
    h.classList.add('dragging');

    function onMove(ev) {
      const rect = body.getBoundingClientRect();
      let w = side === 'left'
        ? ev.clientX - rect.left
        : rect.right - ev.clientX;
      const min = side === 'left' ? MIN_LEFT : MIN_RIGHT;
      w = Math.max(min, Math.min(w, rect.width * 0.4));
      panel.style.width = w + 'px';
    }
    function onUp() {
      body.classList.remove('dragging');
      h.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
});

// ===== 左侧收起 =====

document.getElementById('addToolBtn').onclick = e => {
  e.stopPropagation();

  popup.classList.toggle('hidden');

  if(!avail.length){popup.innerHTML='<div class="p-1.5 text-[11px] text-[#8A7F6E] text-center">全部已打开</div>';return;}
  popup.innerHTML = avail.map(t=>`<button class="flex items-center gap-1 px-1.5 py-1 rounded text-[13px] text-[#1E1A14] hover:bg-[rgba(122,96,64,0.09)] w-full text-left transition-colors" data-t="${t.id}"><span class="text-[#7A6040] text-[11px] w-[13px] text-center">${t.icon}</span><span>${t.name}</span></button>`).join('');

  document.querySelectorAll('#attLights .att-l').forEach(l => { l.style.background='transparent'; l.classList.remove('scale-110'); });

  e.target.style.background=c; e.target.classList.add('scale-110');

document.getElementById('lockBtn').onclick=()=>{
  const b=document.getElementById('lockBtn');
  const lkd=b.textContent==='🔒';

// 递归渲染树节点
function renderTreeNodes(nodes, depth = 0) {
  return nodes.map(n => `
    <div class="flex flex-col" style="margin-left:${depth * 14}px">
      <div class="flex items-center gap-1 px-1.5 py-0.5 rounded cursor-pointer hover:bg-[rgba(122,96,64,0.06)] transition-colors" onclick="this.parentElement.querySelector('.tree-children')?.classList.toggle('hidden')">
        <span class="text-[10px] text-[#8A7F6E] flex-shrink-0 transition-transform ${n.children ? 'rotate-0' : 'invisible'}">▸</span>
        <span class="text-[11px] text-[#7A6040]">${n.children ? '📁' : '📄'}</span>
        <span class="text-[12px] text-[#1E1A14]">${n.label}</span>
      </div>
      <div class="tree-children hidden flex flex-col gap-0.5">
        ${n.content ? `<div class="text-[11px] text-[#5C5242] leading-relaxed px-3 py-0.5" style="margin-left:${depth * 14}px">${n.content}</div>` : ''}
        ${n.children ? renderTreeNodes(n.children, depth + 1) : ''}
      </div>
    </div>
  `).join('');
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月笙 — 写作教练</title>
<style>
/* === DESIGN TOKENS === */
:root {
  /* Dark-mineral palette (not AI-default beige+brass) */
  --accent: #7A6040;
  --accent-hover: #6A5030;
  --accent-light: #C8B088;
  --accent-subtle: rgba(122, 96, 64, 0.09);
  --tag-bg: rgba(122, 96, 64, 0.12);

  --bg-main: #F4F2ED;
  --bg-panel: #EBE7E0;
  --bg-elevated: #FAF8F5;
  --bg-card-color: #FFFFFF;

  --border-main: #C8BFB0;
  --border-subtle: #D9D2C6;

  --text-main: #1E1A14;
  --text-mid: #5C5242;
  --text-dim: #8A7F6E;

  --success: #5A8F68;
  --warning: #C8943C;
  --error: #B84A4A;

  --font-ui: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Noto Serif SC', 'Songti SC', 'Source Han Serif SC', serif;

  --fs-xs: 11px;
  --fs-sm: 13px;
  --fs-base: 14px;
  --fs-lg: 16px;
  --fs-xl: 18px;
  --fs-2xl: 22px;

  --r-sm: 5px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-full: 9999px;

  --shadow-elevated: 0 2px 12px rgba(30, 26, 20, 0.07);
  --shadow-input: 0 1px 4px rgba(30, 26, 20, 0.06);

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 180ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font-ui);font-size:var(--fs-base);
  color:var(--text-main);background:var(--bg-main);
  -webkit-font-smoothing:antialiased
}
button{cursor:pointer;font-family:inherit;font-size:inherit;border:none;background:none;color:inherit;padding:0}
input,textarea{font-family:inherit;font-size:inherit;border:none;background:none;outline:none;color:inherit}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-main);border-radius:var(--r-full)}

/* === APP SHELL === */
.app{
  display:grid;
  grid-template-columns:minmax(200px, 1fr) minmax(0, 2fr) minmax(340px, 1fr);
  height:100dvh;width:100vw;
  background:var(--bg-main);
  transition:grid-template-columns var(--dur) var(--ease);
}

/* - Left collapse - */
.app.lc{grid-template-columns:0 minmax(0, 2fr) minmax(340px, 1fr)}
.app.lc .left{width:0;overflow:hidden;border-right:none;min-width:0}

/* - Right collapse - */
.app.rc .right-body{display:none}
.app.rc .right{min-width:auto}
.app.rc .right-header{border-bottom:none}

/* === LEFT === */
.left{
  background:var(--bg-panel);border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;overflow:hidden;transition:width var(--dur) var(--ease);
  min-width:200px;
}
.left-brand{
  display:flex;align-items:center;
  padding:10px 12px;flex-shrink:0;gap:0;
}
.brand-icon{width:28px;height:28px;border-radius:var(--r-sm);background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:var(--fs-lg);font-weight:600;flex-shrink:0}
.brand-name{font-family:var(--font-display);font-size:var(--fs-lg);font-weight:600;margin-left:7px;color:var(--text-main)}
.collapse-left-btn{margin-left:4px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text-dim);font-size:12px;transition:background var(--dur)}
.collapse-left-btn:hover{background:var(--accent-subtle);color:var(--accent)}
.left-settings{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text-dim);font-size:12px;margin-left:auto;transition:background var(--dur)}
.left-settings:hover{background:var(--accent-subtle);color:var(--accent)}

.left-tabs{padding:0 10px 8px;flex-shrink:0}
.left-tab-row1{width:100%;padding:7px;border-radius:var(--r-sm);color:var(--text-mid);font-size:var(--fs-sm);text-align:center;transition:background var(--dur),color var(--dur);margin-bottom:4px}
.left-tab-row1:hover{background:var(--accent-subtle)}
.left-tab-row1.active{background:var(--accent);color:#fff;font-weight:500}
.left-tab-row2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.left-tab-row2 button{padding:7px;border-radius:var(--r-sm);color:var(--text-mid);font-size:var(--fs-sm);text-align:center;transition:background var(--dur),color var(--dur)}
.left-tab-row2 button:hover{background:var(--accent-subtle)}
.left-tab-row2 button.active{background:var(--accent);color:#fff;font-weight:500}

.left-divider{height:1px;background:var(--border-subtle);margin:0 12px;flex-shrink:0}

.left-search{padding:8px 10px;flex-shrink:0}
.left-search-box{display:flex;align-items:center;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--r-sm);padding:5px 8px}
.left-search-box .icon{color:var(--text-dim);font-size:11px;margin-right:5px}
.left-search-box input{flex:1;min-width:0;font-size:var(--fs-sm);color:var(--text-main);background:transparent}
.left-search-box input::placeholder{color:var(--text-dim)}

.left-list{flex:1;overflow-y:auto;padding:0 10px 8px}
.list-item{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r-sm);
  cursor:pointer;margin-bottom:2px;transition:background var(--dur)
}
.list-item:hover{background:var(--accent-subtle)}
.list-item.active{background:var(--tag-bg)}
.list-item .icon{font-size:12px;color:var(--text-dim);width:14px;text-align:center;flex-shrink:0}
.list-item .title{flex:1;font-size:var(--fs-sm);color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .badge{font-size:10px;color:var(--text-dim);background:var(--bg-elevated);padding:0 5px;border-radius:var(--r-full);flex-shrink:0}

/* === CENTER === */
.center{
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;min-width:0;
  background:var(--bg-main);
}
.center-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px 5px;background:transparent;flex-shrink:0;gap:10px
}
.center-hdr-left{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.project-btn{display:flex;align-items:center;gap:4px;padding:4px 7px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--text-main);font-weight:500;transition:background var(--dur)}
.project-btn:hover{background:var(--accent-subtle)}
.project-btn .caret{font-size:8px;color:var(--text-dim)}

.status-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:var(--r-full);font-size:10px;background:var(--bg-elevated);border:1px solid var(--border-subtle);color:var(--text-mid)}
.status-badge .dot{width:4px;height:4px;border-radius:var(--r-full);background:var(--text-dim)}
.status-badge.teach .dot{background:var(--warning)}
.status-badge.teach{color:var(--warning);border-color:rgba(200,148,60,.3);background:rgba(200,148,60,.07)}

.center-hdr-actions{display:flex;gap:1px;flex-shrink:0}
.center-hdr-actions button{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text-dim);font-size:13px;transition:background var(--dur)}
.center-hdr-actions button:hover{background:var(--accent-subtle);color:var(--accent)}

.center-body{overflow-y:auto;padding:0 20px 10px}

/* Empty state */
.empty-msg{max-width:440px;margin:70px auto 0;text-align:center}
.empty-msg h2{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:600;color:var(--text-main);margin-bottom:20px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--r-md);box-shadow:var(--shadow-elevated);text-align:left;transition:all var(--dur);width:100%}
.choice-btn:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(122,96,64,.1);transform:translateY(-1px)}
.choice-btn .emoji{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.choice-btn .label{font-size:var(--fs-base);font-weight:500;color:var(--text-main)}
.choice-btn .hint{font-size:var(--fs-xs);color:var(--text-dim);margin-top:1px}

/* Messages */
.msgs{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:10px}
.msg{display:flex;gap:9px}
.msg-av{width:26px;height:26px;border-radius:var(--r-full);background:var(--accent-subtle);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:var(--fs-xs);font-weight:600;flex-shrink:0}
.msg-bb{flex:1;font-size:var(--fs-base);line-height:1.65;color:var(--text-main)}
.msg-bb p{margin:0 0 5px}
.msg-bb p:last-child{margin-bottom:0}
.msg-bb .meta{font-size:var(--fs-xs);color:var(--text-dim);margin-top:4px}

/* Input */
.input-area{
  border-top:1px solid var(--border-subtle);background:var(--bg-main);
  padding:5px 20px 10px;height:calc(100dvh / 6);display:flex;flex-direction:column;gap:3px;flex-shrink:0
}
.in-tb{display:flex;align-items:center;justify-content:space-between;height:22px;flex-shrink:0}
.in-tb-l,.in-tb-r{display:flex;align-items:center;gap:3px}
.in-tmpl{padding:1px 6px;border-radius:var(--r-sm);font-size:10px;color:var(--text-mid);transition:background var(--dur)}
.in-tmpl:hover{background:var(--accent-subtle)}
.att-lights{display:flex;align-items:center;gap:3px}
.att-lights .l{width:11px;height:11px;border-radius:var(--r-full);border:1.5px solid currentColor;background:transparent;transition:transform 120ms;cursor:pointer}
.att-lights .l.on{background:currentColor;transform:scale(1.15)}
.l.g{color:var(--success)}.l.y{color:var(--warning)}.l.r{color:var(--error)}
.att-lock{font-size:11px;color:var(--text-dim);padding:1px 4px;border-radius:var(--r-sm);transition:all 120ms}
.att-lock:hover{color:var(--text-mid)}
.att-lock.locked{color:var(--accent);background:var(--accent-subtle)}

.in-box{flex:1;position:relative;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:6px 10px;box-shadow:var(--shadow-input);display:flex;flex-direction:column;min-height:0;transition:border-color var(--dur)}
.in-box:focus-within{border-color:var(--accent)}
.in-ta{flex:1;resize:none;background:transparent;font-size:var(--fs-base);line-height:1.5;color:var(--text-main);padding:0;padding-right:54px;min-height:0}
.in-ta::placeholder{color:var(--text-dim)}
.in-send{position:absolute;bottom:5px;right:6px;padding:3px 12px;background:var(--accent);color:#fff;border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:500;transition:background var(--dur)}
.in-send:hover{background:var(--accent-hover)}
.in-send:disabled{background:var(--border-main);cursor:default}

/* === RIGHT === */
.right{
  background:var(--bg-panel);border-left:1px solid var(--border-subtle);
  display:flex;flex-direction:column;overflow:hidden;min-width:0;transition:min-width var(--dur) var(--ease)
}
.right-hdr{
  display:flex;align-items:center;padding:3px 5px;gap:2px;flex-shrink:0;min-height:32px;
  border-bottom:1px solid var(--border-subtle);overflow:hidden
}
.right-hdr-l{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.right-hdr-l::-webkit-scrollbar{display:none}
.right-hdr-r{display:flex;align-items:center;gap:1px;flex-shrink:0;padding-left:4px;margin-left:4px;border-left:1px solid var(--border-subtle)}

.tool-tab{display:inline-flex;align-items:center;gap:2px;padding:2px 2px 2px 6px;background:var(--bg-elevated);border-radius:var(--r-sm);font-size:10px;color:var(--text-mid);white-space:nowrap;max-width:100px;transition:all var(--dur);flex-shrink:0;border:1px solid transparent}
.tool-tab.active{background:var(--accent);color:#fff;font-weight:500}
.tool-tab:not(.active):hover{background:var(--accent-subtle);color:var(--text-main)}
.tool-tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-tab .cl{width:13px;height:13px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:8px;opacity:.6;flex-shrink:0}
.tool-tab .cl:hover{opacity:1;background:rgba(0,0,0,.06)}
.tool-tab.active .cl:hover{background:rgba(255,255,255,.15)}
.tool-add-btn{width:19px;height:19px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text-dim);font-size:12px;border:1px dashed var(--border-main);flex-shrink:0;transition:all var(--dur)}
.tool-add-btn:hover{background:var(--accent-subtle);color:var(--accent);border-style:solid;border-color:var(--accent)}

.tool-add-popup{position:absolute;top:34px;right:5px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--r-md);box-shadow:var(--shadow-elevated);padding:4px;min-width:130px;z-index:10;display:none}
.tool-add-popup.show{display:block}
.tool-add-popup .item{display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--text-main);cursor:pointer;width:100%;text-align:left}
.tool-add-popup .item:hover{background:var(--accent-subtle)}
.tool-add-popup .item .ic{color:var(--accent);font-size:12px;width:14px;text-align:center}
.right{position:relative}

.w-btn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text-dim);font-size:11px;transition:background var(--dur),color var(--dur)}
.w-btn:hover{background:var(--accent-subtle);color:var(--text-mid)}
.w-btn.cls:hover{background:var(--error);color:#fff}
.w-btn.tog{color:var(--text-dim)}
.w-btn.tog:hover{color:var(--accent)}

.right-body{flex:1;overflow-y:auto;padding:12px}

/* Tool grid */
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 10px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--r-md);text-align:center;transition:all var(--dur);cursor:pointer}
.tc:hover{border-color:var(--accent);box-shadow:var(--shadow-elevated);transform:translateY(-1px)}
.tc .ic{font-size:17px;color:var(--accent);line-height:1}
.tc .lb{font-size:var(--fs-sm);font-weight:500;color:var(--text-main)}
.tc .ht{font-size:var(--fs-xs);color:var(--text-dim)}

/* Tool content */
.tool-content h3{font-family:var(--font-display);font-size:var(--fs-lg);font-weight:600;color:var(--text-main);margin-bottom:10px}
.prog-num{display:flex;align-items:center;justify-content:center;gap:3px;padding:10px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--r-md);margin-bottom:10px}
.prog-num .n{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--accent);line-height:1}
.prog-num .d{color:var(--text-dim)}
.prog-num .t{font-size:var(--fs-lg);color:var(--text-mid)}
.prog-num .lb2{font-size:var(--fs-xs);color:var(--text-dim);margin-left:2px}

.tl-stage{display:flex;align-items:flex-start;gap:9px;padding:6px 0;position:relative}
.tl-stage:not(:last-child)::after{content:'';position:absolute;left:9px;top:25px;bottom:0;width:1px;background:var(--border-subtle)}
.tl-m{width:18px;height:18px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;background:var(--bg-elevated);border:1.5px solid var(--border-subtle);color:var(--text-dim)}
.tl-m.done{background:var(--accent);border-color:var(--accent);color:#fff}
.tl-m.now{border-color:var(--accent);color:var(--accent);background:var(--bg-elevated)}
.tl-txt{flex:1;padding-top:1px}
.tl-txt .sl{font-size:var(--fs-sm);color:var(--text-main);font-weight:500}
.tl-txt .sm{font-size:var(--fs-xs);color:var(--text-dim);margin-top:1px}

.log-day{padding:8px 0;border-bottom:1px solid var(--border-subtle)}
.log-day:last-child{border-bottom:none}
.log-day .dt{font-family:var(--font-display);font-size:var(--fs-base);font-weight:500;color:var(--text-main);margin-bottom:4px}
.log-day .en{font-size:var(--fs-sm);line-height:1.6;color:var(--text-mid);margin-bottom:2px}
.log-day .en .tag-n{color:var(--error)}
.log-day .en .tag-r{color:var(--success)}

/* Training panel */
.tcat{font-size:var(--fs-xs);color:var(--text-dim);letter-spacing:.05em;margin-top:10px;margin-bottom:4px;padding:0 2px;font-weight:500}
.tcat:first-child{margin-top:0}
.tcat.rec{color:var(--accent)}
.titem{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--r-sm);text-align:left;cursor:pointer;transition:all var(--dur);width:100%;margin-bottom:2px}
.titem:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:var(--shadow-elevated)}
.titem .nm2{flex:1;font-size:var(--fs-sm);color:var(--text-main)}
.titem .lv{font-size:10px;color:var(--text-dim);background:var(--bg-panel);padding:1px 4px;border-radius:var(--r-full)}

/* Collapsed header buttons row */
.collapse-row{display:flex;align-items:center;gap:1px}

/* === RESPONSIVE === */
@media(max-width:1279px)and(min-width:1024px){
  .app:not(.left-keep){grid-template-columns:0 minmax(0,2fr) minmax(340px,1fr)}
  .app:not(.left-keep) .left{width:0;overflow:hidden;min-width:0;border-right:none}
}
@media(max-width:1023px){
  .app{grid-template-columns:0 minmax(0,1fr) 0}
  .left,.right{position:fixed;top:0;bottom:0;width:min(300px,85vw);z-index:50;transition:transform var(--dur) var(--ease)}
  .left{left:0;transform:translateX(-100%);border-right:1px solid var(--border-subtle)}
  .right{right:0;transform:translateX(100%);border-left:1px solid var(--border-subtle)}
  .left .left-inner{display:flex}
  .app.lo .left{transform:translateX(0)}
  .app.ro .right{transform:translateX(0)}
  .bd{position:fixed;inset:0;background:rgba(30,26,20,.25);z-index:40;display:none}
  .app.lo .bd,.app.ro .bd{display:block}
  .input-area{padding-left:14px;padding-right:14px}
  .center-hdr{padding:10px 14px 5px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ===== LEFT ===== -->
  <aside class="left">
    <div class="left-brand">
      <span class="brand-icon">月</span>
      <span class="brand-name">月笙</span>
      <button class="collapse-left-btn" id="collapseLeft" title="收起面板">☰</button>
      <button class="left-settings" id="leftSettingsBtn" title="设置">⚙</button>
    </div>

    <div class="left-tabs">
      <button class="left-tab-row1 active" data-tab="train">训练</button>
      <div class="left-tab-row2">
        <button class="active" data-tab="chat">对话</button>
        <button data-tab="proj">项目</button>
      </div>
    </div>

    <div class="left-divider"></div>

    <div class="left-search">
      <div class="left-search-box">
        <span class="icon">⌕</span>
        <input type="text" placeholder="搜索...">
      </div>
    </div>

    <div class="left-list" id="leftList"></div>
  </aside>

  <!-- ===== CENTER ===== -->
  <main class="center">
    <header class="center-hdr">
      <div class="center-hdr-left">
        <button class="project-btn">
          <span class="caret">▼</span>
          <span>我的第一本小说</span>
          <span class="caret">▾</span>
        </button>
        <span class="status-badge teach" id="statusBadge">
          <span class="dot"></span>
          <span>教学中</span>
        </span>
      </div>
      <div class="center-hdr-actions">
        <button title="新建会话">＋</button>
        <button title="设置">⚙</button>
      </div>
    </header>

    <div class="center-body" id="centerBody"></div>

    <footer class="input-area">
      <div class="in-tb">
        <div class="in-tb-l"><button class="in-tmpl">[模板]</button></div>
        <div class="in-tb-r">
          <div class="att-lights" id="attLights">
            <button class="l g on" data-lv="gentle" title="豆包(温和)"></button>
            <button class="l y" data-lv="balance" title="月笙(平衡)"></button>
            <button class="l r" data-lv="direct" title="sensei(直接)"></button>
          </div>
          <button class="att-lock" id="attLock" title="锁定档位">🔓</button>
        </div>
      </div>
      <div class="in-box">
        <textarea class="in-ta" rows="2" placeholder="输入你的作品，或直接开始对话..."></textarea>
        <button class="in-send" disabled>发送</button>
      </div>
    </footer>
  </main>

  <!-- ===== RIGHT ===== -->
  <aside class="right">
    <div class="right-hdr" id="rightHdr"></div>
    <div class="right-body" id="rightBody"></div>
    <div class="tool-add-popup" id="toolPopup"></div>
  </aside>

  <div class="bd" id="backdrop"></div>
</div>

<!-- Preview controls -->
<div style="position:fixed;top:5px;left:50%;transform:translateX(-50%);background:var(--text-main);color:var(--bg-main);padding:2px 10px;border-radius:var(--r-full);font-size:10px;z-index:200;box-shadow:var(--shadow-elevated);display:flex;align-items:center;gap:6px">
  <span style="color:var(--accent-light);font-weight:600;">V4</span>
  <a href="#" id="togLeft" style="color:inherit;text-decoration:none;padding:1px 4px;border-radius:var(--r-sm)">左栏</a>
  <a href="#" id="togRight" style="color:inherit;text-decoration:none;padding:1px 4px;border-radius:var(--r-sm)">右栏</a>
  <span style="opacity:.3">|</span>
  <a href="#" id="togStatus" style="color:inherit;text-decoration:none;padding:1px 4px;border-radius:var(--r-sm)">状态</a>
  <a href="#" id="resetAll" style="color:inherit;text-decoration:none;padding:1px 4px;border-radius:var(--r-sm)">重置</a>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const app=$('#app'),list=$('#leftList'),body=$('#centerBody'),rh=$('#rightHdr'),rb=$('#rightBody'),pop=$('#toolPopup'),sb=$('#statusBadge');
let tab='chat',sid=null,tools=[],atid=null,col=false,stat='teach';

const sss=[
  {id:1,title:'初稿诊断',t:'chat',tm:'今天'},{id:2,title:'第一章节奏讨论',t:'chat',tm:'昨天'},
  {id:3,title:'训练：动作替代情绪词',t:'train',tm:'3天前'},{id:4,title:'配角动机梳理',t:'chat',tm:'5天前'},
  {id:5,title:'训练：对话节奏',t:'train',tm:'上周'}
];
const pt=[
  {id:'p1',title:'第一章：山门',t:'ch'},{id:'p2',title:'第二章：试炼',t:'ch'},
  {id:'p3',title:'第三章：初遇',t:'ch'},{id:'p4',title:'第四章：暗流',t:'ch'},{id:'p5',title:'大纲',t:'nt'}
];
const tc=[
  {n:'推荐技法',r:true,is:[{n:'动作替代情绪词',l:'入门'},{n:'对话节奏控制',l:'入门'}]},
  {n:'结构技法',is:[{n:'三幕剧结构',l:'进阶'},{n:'伏笔回收',l:'进阶'}]},
  {n:'人物技法',is:[{n:'动机层次',l:'入门'},{n:'视角切换',l:'高阶'}]}
];
const tl=[
  {id:'prog',n:'教学进度',ic:'◐',h:'纵向时序'},{id:'log',n:'学习日志',ic:'✎',h:'每日记录'},
  {id:'ms',n:'作品',ic:'☰',h:'章节编辑器'},{id:'nt',n:'教学笔记',ic:'✤',h:'设定树'},
  {id:'set',n:'设置',ic:'⚙',h:'API Key & 偏好'}
];
const msgs=[
  {r:'ai',c:'<p>早上好。你昨天发的开头整体氛围不错。</p><p>节奏稍慢了一些，主要集中在第一段环境描写。你方便聊聊为什么用这么长一段开始吗？</p>',t:'10:32'},
  {r:'me',c:'<p>我怕读者不了解世界观会看不懂后面的剧情。</p>',t:'10:33'},
  {r:'ai',c:'<p>这个担心我理解。试试先给一个"钩子"（人物处境、悬念），世界观通过后续情节自然透露。一边看一边懂，比一次性说清更有效。</p>',t:'10:34'}
];

function rRHdr(){
  if(col){
    rh.innerHTML=`<div class="right-hdr-r" style="width:100%;justify-content:flex-end;"><div class="collapse-row"><div class="w-btn" id="addColl" title="添加工具">＋</div><div class="w-btn" id="setColl" title="设置">⚙</div><div style="width:1px;height:12px;background:var(--border-subtle);margin:0 2px"></div><div class="w-btn tog" id="expColl" title="展开内容区">⤢</div><div class="w-btn" data-w="min" title="最小化">─</div><div class="w-btn" data-w="max" title="最大化">□</div><div class="w-btn cls" data-w="close" title="关闭">✕</div></div></div>`;
    $('#addColl').onclick=e=>{e.stopPropagation();pop.classList.toggle('show');rPopup();};
    $('#setColl').onclick=()=>openTool('set');
    $('#expColl').onclick=()=>{col=0;app.classList.remove('rc');rRHdr();rRBody();};
    return;
  }
  const l=tools.length?rTabs():'<div class="right-hdr-l"></div>';
  rh.innerHTML=l+`<div class="right-hdr-r"><div class="w-btn tog" id="hidColl" title="收起内容区">⤢</div><div class="w-btn" data-w="min">─</div><div class="w-btn" data-w="max">□</div><div class="w-btn cls" data-w="close">✕</div></div>`;
  bindRH();
}
function rTabs(){
  const ts=tools.map(t=>{const o=tl.find(x=>x.id===t);return `<div class="tool-tab ${t===atid?'active':''}" data-t="${t}"><span class="nm">${o?o.n:t}</span><span class="cl" data-c="${t}">✕</span></div>`;}).join('');
  return `<div class="right-hdr-l">${ts}<button class="tool-add-btn" id="addBtn" title="添加工具">＋</button></div>`;
}
function bindRH(){
  $$('.tool-tab').forEach(t=>{t.onclick=e=>{if(e.target.classList.contains('cl')){e.stopPropagation();closeTool(e.target.dataset.c);return;}atid=t.dataset.t;rRHdr();rRBody();};});
  const a=$('#addBtn');if(a)a.onclick=e=>{e.stopPropagation();pop.classList.toggle('show');rPopup();};
  const h=$('#hidColl');if(h)h.onclick=()=>{col=1;app.classList.add('rc');rRHdr();};
}
function rPopup(){
  const its=tl.filter(t=>!tools.includes(t.id));
  if(!its.length){pop.innerHTML='<div style="padding:6px;color:var(--text-dim);font-size:var(--fs-xs);text-align:center">所有工具已打开</div>';return;}
  pop.innerHTML=its.map(t=>`<button class="item" data-t="${t.id}"><span class="ic">${t.ic}</span><span>${t.n}</span></button>`).join('');
  $$('.item').forEach(i=>{i.onclick=()=>{openTool(i.dataset.t);pop.classList.remove('show');};});
}
document.addEventListener('click',e=>{if(!e.target.closest('#addBtn')&&!e.target.closest('#toolPopup'))pop.classList.remove('show');});

function openTool(id){
  if(!tools.includes(id))tools.push(id);
  atid=id;col=0;app.classList.remove('rc');rRHdr();rRBody();
}
function closeTool(id){
  tools=tools.filter(t=>t!==id);if(atid===id)atid=tools[tools.length-1]||null;
  if(!tools.length){rRHdr();rGrid();}else{rRHdr();rRBody();}
}
function rRBody(){if(!tools.length)rGrid();else{if(!atid)atid=tools[0];rb.innerHTML=rCont(atid);}}
function rGrid(){
  rb.innerHTML=`<div class="tg">${tl.map(t=>`<button class="tc" data-t="${t.id}"><span class="ic">${t.ic}</span><span class="lb">${t.n}</span><span class="ht">${t.h}</span></button>`).join('')}</div>`;
  $$('.tc').forEach(c=>{c.onclick=()=>openTool(c.dataset.t);});
}
function rCont(id){
  const o=tl.find(t=>t.id===id),n=o?o.n:id;
  if(id==='prog')return `<div class="tool-content"><h3>${n}</h3><div class="prog-num"><span class="n">3</span><span class="d">/</span><span class="t">7</span><span class="lb2">已解决</span></div><div class="tl-stage"><div class="tl-m done">✓</div><div class="tl-txt"><div class="sl">提交作品</div><div class="sm">2026-06-15</div></div></div><div class="tl-stage"><div class="tl-m done">✓</div><div class="tl-txt"><div class="sl">诊断分析</div><div class="sm">发现7个问题</div></div></div><div class="tl-stage"><div class="tl-m now">●</div><div class="tl-txt"><div class="sl">教学中</div><div class="sm">当前: 对话节奏</div></div></div><div class="tl-stage"><div class="tl-m">○</div><div class="tl-txt"><div class="sl">已收尾</div></div></div><div class="tl-stage"><div class="tl-m">○</div><div class="tl-txt"><div class="sl">等待修改</div></div></div></div>`;
  if(id==='log')return `<div class="tool-content"><h3>${n}</h3><div class="log-day"><div class="dt">6月17日</div><div class="en"><span class="tag-n">新发现:</span> 铺垫过多</div><div class="en"><span class="tag-r">已攻克:</span> 动作替代情绪词</div></div><div class="log-day"><div class="dt">6月15日</div><div class="en"><span class="tag-n">新发现:</span> 信息硬塞</div><div class="en"><span class="tag-r">已攻克:</span> 对话节奏</div></div></div>`;
  if(id==='set')return `<div class="tool-content"><h3>${n}</h3><div style="margin-bottom:10px"><div style="font-size:var(--fs-sm);color:var(--text-mid);margin-bottom:3px">API Key</div><input type="password" placeholder="sk-..." style="width:100%;padding:5px 8px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--r-sm);font-size:var(--fs-sm)"></div><div><div style="font-size:var(--fs-sm);color:var(--text-mid);margin-bottom:3px">默认态度</div><div class="att-lights" style="opacity:1;pointer-events:auto"><button class="l g on"></button><button class="l y"></button><button class="l r"></button></div></div><button style="margin-top:14px;padding:5px 12px;background:var(--accent);color:#fff;border-radius:var(--r-md);font-size:var(--fs-sm)">保存</button></div>`;
  return `<div class="tool-content"><h3>${n}</h3><p style="color:var(--text-dim);font-size:var(--fs-sm);line-height:1.6">该工具的具体内容将在后续阶段实施。</p></div>`;
}

function rTrain(){
  rh.innerHTML=`<div class="right-hdr-l"><div class="tool-tab active"><span class="nm">训练技法</span><span class="cl" id="closeTrain">✕</span></div></div><div class="right-hdr-r"><div class="w-btn tog" id="hidColl" title="收起内容区">⤢</div><div class="w-btn" data-w="min">─</div><div class="w-btn" data-w="max">□</div><div class="w-btn cls" data-w="close">✕</div></div>`;
  rb.innerHTML=tc.map(c=>`<div class="tcat ${c.r?'rec':''}">${c.n}${c.r?'  👍':''}</div><div>${c.is.map(i=>`<button class="titem"><span class="nm2">${i.n}</span><span class="lv">${i.l}</span></button>`).join('')}</div>`).join('');
  $('#closeTrain').onclick=()=>{tools=[];atid=null;rRHdr();rGrid();$$('.left-tab-row1,.left-tab-row2 button').forEach(b=>b.classList.remove('active'));$('.left-tab-row2 button[data-tab="chat"]').classList.add('active');tab='chat';sid=null;rList();rChat();};
  bindRH();
}

function rList(){
  if(tab==='chat')list.innerHTML=sss.filter(s=>s.t==='chat').map(s=>`<div class="list-item ${sid===s.id?'active':''}" data-id="${s.id}"><span class="icon">◌</span><span class="title">${s.title}</span><span class="badge">${s.tm}</span></div>`).join('');
  else if(tab==='proj')list.innerHTML=pt.map(p=>`<div class="list-item"><span class="icon">${p.t==='ch'?'☰':'✎'}</span><span class="title">${p.title}</span></div>`).join('');
  else list.innerHTML=sss.filter(s=>s.t==='train').map(s=>`<div class="list-item active" data-id="${s.id}"><span class="icon">◎</span><span class="title">${s.title}</span><span class="badge">${s.tm}</span></div>`).join('');
  $$('.list-item').forEach(i=>{i.onclick=()=>{if(tab==='proj')openTool('ms');else{sid=parseInt(i.dataset.id);rList();rChat();}};});
}
function rChat(){
  if(!sid){body.innerHTML=`<div class="empty-msg"><h2>开始你的写作之旅</h2><div class="choices"><button class="choice-btn"><span class="emoji">📝</span><div><div class="label">我有作品</div><div class="hint">直接进入聊天，我会帮你分析</div></div></button><button class="choice-btn"><span class="emoji">🌱</span><div><div class="label">从头学习</div><div class="hint">我引导你搭建世界观和人物</div></div></button><button class="choice-btn"><span class="emoji">💬</span><div><div class="label">先聊聊</div><div class="hint">正常聊天，我在对话中自然引导</div></div></button></div></div>`;return;}
  body.innerHTML=`<div class="msgs">${msgs.map(m=>`<div class="msg"><div class="msg-av">${m.r==='ai'?'月':'我'}</div><div class="msg-bb">${m.c}<div class="meta">${m.t}</div></div></div>`).join('')}</div>`;
}

function setStatus(s){stat=s;sb.className='status-badge '+s;const m={idle:'待开始',diag:'诊断中',teach:'教学中',done:'已收尾'};sb.innerHTML=`<span class="dot"></span><span>${m[s]||s}</span>`;}

// Tabs
$$('.left-tab-row1,.left-tab-row2 button').forEach(b=>{b.onclick=()=>{$$('.left-tab-row1,.left-tab-row2 button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;if(tab==='train'){rTrain();sid=null;}else{if(!tools.length){rRHdr();rGrid();}else rRHdr();}rList();rChat();};});

// Attitude
$('#attLights').addEventListener('click',e=>{if(!e.target.classList.contains('l'))return;if($('#attLock').classList.contains('locked'))return;$$('.l').forEach(l=>l.classList.remove('on'));e.target.classList.add('on');});
let lkd=0;
$('#attLock').onclick=()=>{lkd=!lkd;$('#attLock').textContent=lkd?'🔒':'🔓';$('#attLock').classList.toggle('locked',lkd);const el=$('#attLights');el.style.opacity=lkd?'.4':'1';el.style.pointerEvents=lkd?'none':'auto';};

// Panel controls
$('#collapseLeft').onclick=()=>{app.classList.toggle('lc');};
$('#togLeft').onclick=e=>{e.preventDefault();app.classList.toggle('lc');};
$('#togRight').onclick=e=>{e.preventDefault();col=!col;app.classList.toggle('rc',col);rRHdr();};
$('#togStatus').onclick=e=>{e.preventDefault();const c=['idle','diag','teach','done'];setStatus(c[(c.indexOf(stat)+1)%c.length]);};
$('#resetAll').onclick=e=>{e.preventDefault();app.classList.remove('lc','rc','lo','ro');col=0;$$('.left-tab-row1,.left-tab-row2 button').forEach(b=>b.classList.remove('active'));$('.left-tab-row1').classList.add('active');$('.left-tab-row2 button[data-tab="chat"]').classList.add('active');tab='chat';sid=null;tools=[];atid=null;rList();rTrain();$$('.l').forEach(l=>l.classList.remove('on'));$('.l.g').classList.add('on');lkd=0;$('#attLock').textContent='🔓';$('#attLock').classList.remove('locked');$('#attLights').style.opacity='1';$('#attLights').style.pointerEvents='auto';setStatus('teach');};
$('#backdrop').onclick=()=>{app.classList.remove('lo','ro');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){app.classList.remove('lo','ro');pop.classList.remove('show');}});

// Init
rList();rTrain();setStatus('teach');
</script>
</body>
</html>

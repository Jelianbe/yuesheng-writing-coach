#appRoot.dragging *{user-select:none!important}
#appRoot.dragging .panel-trans{transition:none!important}

const MIN_LEFT = 160, MIN_RIGHT = 260;
document.querySelectorAll('.resize-handle').forEach(h => {
  h.addEventListener('mousedown', e => {
    e.preventDefault();
    const side = h.dataset.side;
    const panel = document.getElementById(side === 'left' ? 'leftPanel' : 'rightPanel');
    body.classList.add('dragging');
    h.classList.add('dragging');

    function onMove(ev) {
      const rect = body.getBoundingClientRect();
      let w = side === 'left'
        ? ev.clientX - rect.left
        : rect.right - ev.clientX;
      const min = side === 'left' ? MIN_LEFT : MIN_RIGHT;
      w = Math.max(min, Math.min(w, rect.width * 0.4));
      panel.style.width = w + 'px';
    }
    function onUp() {
      body.classList.remove('dragging');
      h.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
});

// ===== 左侧收起 =====
document.getElementById('collapseLeftBtn').onclick=()=>{body.classList.toggle('lc')};
document.getElementById('expandLeftBtn').onclick=()=>{body.classList.toggle('lc')};
document.getElementById('collapseRightBtn').onclick=()=>{body.classList.toggle('rc')};
document.getElementById('rBarExp').onclick=()=>body.classList.remove('rc');

// ===== 添加工具 =====
document.getElementById('addToolBtn').onclick = e => {
  e.stopPropagation();
  const popup = document.getElementById('toolPopup');
  popup.classList.toggle('hidden');
  popup.classList.toggle('popup-enter',!popup.classList.contains('hidden'));
  const avail = ALL_TOOLS.filter(t=>!openTools.includes(t.id));
  if(!avail.length){popup.innerHTML='<div class="p-1.5 text-[11px] text-[#8A7F6E] text-center">全部已打开</div>';return;}
  popup.innerHTML = avail.map(t=>`<button class="flex items-center gap-1 px-1.5 py-1 rounded text-[13px] text-[#1E1A14] hover:bg-[rgba(122,96,64,0.09)] w-full text-left transition-colors" data-t="${t.id}"><span class="text-[#7A6040] text-[11px] w-[13px] text-center">${t.icon}</span><span>${t.name}</span></button>`).join('');
  popup.querySelectorAll('[data-t]').forEach(el=>{el.onclick=()=>{openTool(el.dataset.t);document.getElementById('toolPopup').classList.add('hidden');};});
};
document.addEventListener('click', e => {
  if(!e.target.closest('#addToolBtn')&&!e.target.closest('#toolPopup')) document.getElementById('toolPopup').classList.add('hidden');
});
document.getElementById('rBarAdd').onclick = e => {
  e.stopPropagation();
  body.classList.remove('rc');
  setTimeout(()=>document.getElementById('addToolBtn')?.click(),280);
};

// ===== 态度灯 =====
document.getElementById('attLights').addEventListener('click', e => {
  if (!e.target.classList.contains('att-l')) return;
  if (document.getElementById('lockBtn').classList.contains('locked')) return;
  document.querySelectorAll('#attLights .att-l').forEach(l => { l.style.background='transparent'; l.classList.remove('scale-110'); });
  const c = e.target.dataset.lv==='doubao'?'#5A8F68':e.target.dataset.lv==='yuesheng'?'#C8943C':'#B84A4A';
  e.target.style.background=c; e.target.classList.add('scale-110');
});
document.getElementById('lockBtn').onclick=()=>{
  const b=document.getElementById('lockBtn');
  const lkd=b.textContent==='🔒';
  b.textContent=lkd?'🔓':'🔒';
  b.classList.toggle('locked',!lkd);
  b.classList.toggle('text-[#7A6040]',!lkd);
  document.getElementById('attLights').style.opacity=lkd?'1':'.4';
  document.getElementById('attLights').style.pointerEvents=lkd?'auto':'none';
};

// ===== 初始化 =====
renderAll();
function renderAll(){renderList();renderCenter();renderRight();}
</script>
</body>

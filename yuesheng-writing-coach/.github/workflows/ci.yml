name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: CSS lint
        run: npm run lint:css
      - name: Format check
        run: npm run format:check
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Color contrast check
        run: npm run scan:hardcode
      - name: Run tests
        run: npm run test

  build:
    needs: typecheck-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
